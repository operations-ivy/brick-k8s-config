      <symbol id="m-argocd" viewBox="0 0 240 114">
        <rect width="240" height="114" fill="#eef0f2"/>
        <rect width="26" height="114" fill="#0f2b3a"/>
        <circle cx="13" cy="12" r="6" fill="#ef7b4d"/>
        <g fill="#5c7686"><rect x="8" y="28" width="10" height="3"/><rect x="8" y="38" width="10" height="3"/><rect x="8" y="48" width="10" height="3"/></g>
        <g fill="none" stroke="#9fb0ba" stroke-width="1.200"><path d="M72 57c16 0 14-34 30-34M72 57h30M72 57c16 0 14 34 30 34M144 23c16 0 14-11 30-11M144 23c16 0 14 12 30 12M144 91c16 0 14-11 30-11M144 91c16 0 14 12 30 12"/></g>
        <g fill="#fff" stroke="#cfd7dc" stroke-width=".8">
          <rect x="34" y="47" width="38" height="20" rx="2"/><rect x="102" y="14" width="42" height="18" rx="2"/><rect x="102" y="48" width="42" height="18" rx="2"/><rect x="102" y="82" width="42" height="18" rx="2"/>
          <rect x="174" y="4" width="54" height="16" rx="2"/><rect x="174" y="27" width="54" height="16" rx="2"/><rect x="174" y="72" width="54" height="16" rx="2"/><rect x="174" y="95" width="54" height="16" rx="2"/>
        </g>
        <g fill="#18be94"><circle cx="42" cy="57" r="4"/><circle cx="110" cy="23" r="3.500"/><circle cx="110" cy="57" r="3.500"/><circle cx="110" cy="91" r="3.500"/><circle cx="181" cy="12" r="3"/><circle cx="181" cy="35" r="3"/><circle cx="181" cy="80" r="3"/><circle cx="181" cy="103" r="3"/></g>
        <g fill="#8a9ba6"><rect x="49" y="55" width="18" height="4"/><rect x="117" y="21" width="22" height="4"/><rect x="117" y="55" width="20" height="4"/><rect x="117" y="89" width="22" height="4"/><rect x="188" y="10" width="34" height="4"/><rect x="188" y="33" width="28" height="4"/><rect x="188" y="78" width="32" height="4"/><rect x="188" y="101" width="26" height="4"/></g>
