tempo:
  retention: 96h
  # The chart lists a bare `opencensus:` (null) receiver. Argo CD's Helm 4
  # drops it, so OpenCensus is off; Helm 3 can't remove a null default and
  # would keep it, so `helm template` here still shows it. Nothing sends
  # OpenCensus (traces go OTLP through the collector).
  receivers:
    opencensus: null
  # The chart reads resources from `tempo.resources`; a top-level `resources`
  # is silently ignored, which left tempo-0 unbounded until 2026-09-24.
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      # ~216Mi before any wigle-sync traces; headroom for more instrumented apps.
      memory: 1Gi
      cpu: 500m

persistence:
  enabled: true
  size: 10Gi

nodeSelector:
  chuck.io/storage-node: "true"

# Tempo's own metrics (spans received, blocks, the compactor).
serviceMonitor:
  enabled: true
