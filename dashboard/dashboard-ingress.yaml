apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: dashboard-transport
  namespace: kubernetes-dashboard
spec:
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dashboard-ingressroute
  namespace: kubernetes-dashboard
spec:
  entryPoints:
    - websecure
  routes:
    # dashboard.brick.nozdormu.cloud through brick9000's proxy (brick-cicd-config);
    # dashboard.local goes once nothing uses it.
    - match: Host(`dashboard.brick.nozdormu.cloud`) || Host(`dashboard.local`)
      kind: Rule
      services:
        - name: kubernetes-dashboard
          port: 443
          scheme: https
          serversTransport: dashboard-transport
  tls: {}
