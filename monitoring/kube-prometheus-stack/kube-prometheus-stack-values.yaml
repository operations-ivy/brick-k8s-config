alertmanager:
  enabled: true
  # The chart reads Alertmanager's resources from alertmanagerSpec — a bare
  # `alertmanager.resources` is silently ignored (it was, until 2026-09-24).
  alertmanagerSpec:
    resources:
      requests:
        memory: 32Mi
        cpu: 10m
      limits:
        memory: 128Mi
        cpu: 100m

grafana:
  enabled: true
  # Real value lives in monitoring/kube-prometheus-stack/grafana-admin-sealedsecret.yaml
  # (encrypted, safe to commit) — decrypted in-cluster by the sealed-secrets
  # controller into a plain Secret this only references by name.
  admin:
    existingSecret: "grafana-admin-credentials"
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: false
  # No CPU limit: with no persistence every new pod rebuilds its database and
  # reinstalls plugins, and at 200m that took longer than the liveness probe
  # allows on a Pi 4 (brick1982), so the pod was killed in a loop. It idles
  # well under its request, so it only bursts while starting.
  resources:
    requests:
      memory: 300Mi
      cpu: 100m
    limits:
      memory: 600Mi
  service:
    type: ClusterIP
  additionalDataSources:
    # Fixed uids so dashboards (and the cross-links below) can reference these
    # by uid instead of by whatever Grafana generates.
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      isDefault: false
      editable: false
      jsonData:
        # Apps that log JSON with a `trace_id` field (wigle-sync) get a
        # one-click link from the log line to the trace in Tempo.
        derivedFields:
          - name: TraceID
            matcherType: regex
            matcherRegex: '"trace_id":\s*"(\w+)"'
            url: "$${__value.raw}"
            datasourceUid: tempo
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3200
      isDefault: false
      editable: false
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          filterByTraceID: true
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
          customQuery: true
          query: '{namespace=~".+"} |= "$${__trace.traceId}"'

kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
# kube-proxy runs inside k3s on every node, but serves its metrics only on
# 127.0.0.1:10249, so Prometheus found no targets and KubeProxyDown fired
# (critical) from 2026-10-04, though kube-proxy was fine. Off: no
# ServiceMonitor, no kube-proxy rules.
kubeProxy:
  enabled: false

nodeExporter:
  enabled: true

prometheus-node-exporter:
  hostNetwork: true
  # The chart's two filesystem excludes (setting extraArgs replaces them), plus
  # the systemd collector: each node's system services and timers, through the
  # host's D-Bus socket. It feeds the chart's NodeSystemdServiceFailed and
  # NodeSystemdServiceCrashlooping alerts (restarts metrics) and
  # node_systemd_timer_last_trigger_seconds. The exporter's uid (65534) is
  # "nobody" on every node, so D-Bus accepts it (gotchas.md, overwatch).
  # System units only: user units need brick-cicd-config#68.
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
    - --collector.systemd
    - --collector.systemd.enable-restarts-metrics
    - --collector.systemd.unit-include=.+\.(service|timer)
    # Every node is on Wi-Fi: signal, bitrate and retries to the router.
    - --collector.wifi
    # Hosts' own reports, for whatever a node writes here (brick1982's
    # brick-units.timer did until it left the cluster; it now has its own
    # node-exporter, scraped as brick1982-node below).
    - --collector.textfile.directory=/host/textfile
  extraHostVolumeMounts:
    - name: dbus
      hostPath: /run/dbus/system_bus_socket
      type: Socket
      mountPath: /var/run/dbus/system_bus_socket
      readOnly: true
    - name: textfile
      hostPath: /var/lib/node-exporter-textfile
      type: DirectoryOrCreate
      mountPath: /host/textfile
      readOnly: true
  service:
    port: 19100
    targetPort: 19100
  # No CPU limit. It averages 2-6m, but each scrape runs its collectors in
  # parallel on all four cores (the systemd one walks ~700 units), and a
  # limit throttles those bursts: 27-35% of periods at 250m, the same as at
  # 100m (CPUThrottlingHigh, scrapes 0.2-0.4 s). The request keeps it fairly
  # scheduled.
  resources:
    requests:
      memory: 50Mi
      cpu: 50m
    limits:
      memory: 100Mi

prometheus:
  enabled: true
  prometheusSpec:
    # 72h so a problem found a day or two later still has its metrics.
    # Measured 2026-10-01 at ~127k head series: ~20MB/h of blocks plus ~260MB
    # WAL, so ~1.9GB at 72h, well inside the 10Gi volume and retentionSize.
    retention: 72h
    serviceMonitorSelectorNilUsesHelmValues: false
    # Every namespace. ({} is "match all"; the old `any: true` isn't a field of
    # the Prometheus CRD and was silently dropped, so this changes nothing live.)
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    # Jenkins (brick-cicd-config's jenkins/) brings its own ServiceMonitor, as
    # job="jenkins", the job name it had while it ran on brick9000.
    replicas: 1
    # Hosts outside the cluster (brick-cicd-config README, "Metrics"):
    # brick9000's node-exporter and Caddy, brick-status through the proxy (it
    # listens on localhost there), and brick1982's node-exporter and LCARS panel. The
    # `instance` is the host's name, as node_uname_info's nodename. Targets
    # are host names, which the router's DNS resolves from each host's DHCP
    # lease, so a host that moves to a new address needs no change here. While
    # brick9000 was away, its old address 192.168.1.221 (now the front door's)
    # had this job scraping brick2000's node-exporter as "brick9000".
    additionalScrapeConfigs:
      - job_name: brick9000-node
        static_configs:
          - targets: ["brick9000:9100"]
            labels: {instance: brick9000}
      # The front door's Caddy, on the cluster since brick9000 died
      # (2026-10-17, brick-k8s-config front-door/).
      - job_name: caddy
        static_configs:
          - targets: ["caddy.front-door.svc.cluster.local:9180"]
            labels: {instance: front-door}
      # The whole way in, as a browser takes it: DNS, 192.168.1.221 (kube-vip),
      # Caddy's Let's Encrypt certificate, Traefik, then Prometheus itself.
      # `up` is the result (FrontDoorDown); the samples duplicate the
      # prometheus job's, so none are kept.
      - job_name: front-door
        scheme: https
        static_configs:
          - targets: ["prometheus.brick.nozdormu.cloud"]
            labels: {instance: front-door}
        metric_relabel_configs:
          - {action: drop, source_labels: [__name__], regex: ".+"}
      - job_name: brick-status
        scheme: https
        static_configs:
          - targets: ["status.brick.nozdormu.cloud"]
            labels: {instance: brick9000}
      - job_name: brick1982-node
        static_configs:
          - targets: ["brick1982:9100"]
            labels: {instance: brick1982}
      # The LCARS panel (operations-ivy/rpi_lcars), which replaced brick-arena.
      - job_name: lcars
        static_configs:
          - targets: ["brick1982:8767"]
            labels: {instance: brick1982}
    # brick69 goes wardriving, out of reach for hours: a Prometheus agent on it
    # keeps scraping and remote-writes the backlog once it's home (wigle-sync's
    # pi/setup-metrics.sh), through prometheus.brick.nozdormu.cloud. The
    # out-of-order window lets that backlog in, up to a day old. Anyone on the
    # LAN can write series this way, as anyone there can already read them.
    enableRemoteWriteReceiver: true
    tsdb:
      outOfOrderTimeWindow: 24h
    # On the NVMe worker like Loki/Tempo, not brick420's SD card: TSDB churn
    # is exactly the write pattern that wears SD cards out, and local-path
    # volumes can't be resized in place, so size for growth up front.
    nodeSelector:
      chuck.io/storage-node: "true"
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    # Hard cap under the volume size so a cardinality spike trims old blocks
    # instead of filling the disk and crash-looping.
    retentionSize: 8GB
    # Sized 2026-09-24 at ~98k head series: working set sat pinned at the old
    # 300Mi limit and was OOM-killed on every 2h compaction (45 restarts), and
    # CPU was throttled 31% at 200m. Headroom here is for new apps' series.
    resources:
      requests:
        memory: 768Mi
        cpu: 200m
      limits:
        memory: 1536Mi
        cpu: 1000m

kube-state-metrics:
  resources:
    limits:
      memory: 100Mi
      cpu: 100m

# Our own alert rules. brick9000's board shows the same problems directly
# (brick-cicd-config, brick_status/units.py); these are for Alertmanager.
additionalPrometheusRulesMap:
  brick-units:
    groups:
      - name: brick-units
        rules:
          - alert: BrickUnitProblem
            expr: brick_systemd_unit_problem == 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.unit }} ({{ $labels.scope }}) on {{ $labels.instance }}: {{ $labels.problem }}"
          - alert: BrickUnitReportStale
            expr: time() - brick_systemd_report_timestamp_seconds > 600
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "brick-units hasn't reported from {{ $labels.instance }} for over 10 minutes"
  # Every host syncs its clock over the internet (timesyncd); brick69 also
  # from its GPS. No local time server: a pod can't set its host's clock, and
  # the nodes need the right time before k3s starts. These catch a host that
  # stops syncing. brick69's samples arrive late (remote write), so its
  # alerts fire late too.
  brick-time:
    groups:
      - name: brick-time
        rules:
          - alert: BrickClockNotSynced
            expr: node_timex_sync_status == 0
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.instance }}'s clock hasn't synced for 30 minutes"
          - alert: BrickClockOffset
            expr: abs(node_timex_offset_seconds) > 0.5
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.instance }}'s clock is {{ $value | humanizeDuration }} off"
  # Argo CD (#42): every app should be Synced, Healthy, on automated sync and
  # on main. A failing sync, a stuck rollout or a trial left on a branch shows
  # up here instead of being noticed by chance. max by (name): one series per
  # app, whichever controller pod reports it.
  brick-argocd:
    groups:
      - name: brick-argocd
        rules:
          - alert: ArgoAppOutOfSync
            expr: max by (name) (argocd_app_info{sync_status!="Synced"}) == 1
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Argo CD app {{ $labels.name }} hasn't matched git for 15 minutes"
          - alert: ArgoAppUnhealthy
            expr: max by (name, health_status) (argocd_app_info{health_status!="Healthy"}) == 1
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Argo CD app {{ $labels.name }} has been {{ $labels.health_status }} for 15 minutes"
          - alert: ArgoSyncFailing
            expr: sum by (name) (increase(argocd_app_sync_total{phase=~"Error|Failed"}[30m])) > 0
            labels:
              severity: warning
            annotations:
              summary: "Argo CD couldn't sync {{ $labels.name }} in the last 30 minutes"
          - alert: ArgoAutoSyncOff
            expr: max by (name) (argocd_app_info{autosync_enabled="false"}) == 1
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "Argo CD app {{ $labels.name }} has had automated sync off for an hour"
          - alert: ArgoAppOnBranch
            expr: max by (name) (argocd_app_labels{label_brick_trial="true"}) == 1
            for: 24h
            labels:
              severity: warning
            annotations:
              summary: "Argo CD app {{ $labels.name }} has been on a branch for a day: scripts/trial-branch {{ $labels.name }} main"
  # SoC temperature on every host. brick666's case fan was never switched on
  # (2026-10-15) and it idled at ~80 °C for a week unnoticed; its fan has no
  # tach wire, so temperature is the only sign the fan has died. Pis
  # soft-throttle at 80 °C. Over the 14 days before this, the hottest
  # 15-minute stretch on any healthy host was 65.7 °C (brick9000). node-exporter
  # can briefly have two series per host after a restart, hence max by.
  brick-temperature:
    groups:
      - name: brick-temperature
        rules:
          - alert: BrickNodeHot
            expr: max by (instance) (node_hwmon_temp_celsius{chip="thermal_thermal_zone0"}) > 70
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.instance }} has been above 70 °C for 15 minutes ({{ $value | printf \"%.1f\" }} °C): check its fan"
          - alert: BrickNodeThrottling
            expr: max by (instance) (node_hwmon_temp_celsius{chip="thermal_thermal_zone0"}) > 80
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.instance }} is at {{ $value | printf \"%.1f\" }} °C, past the Pi's 80 °C throttle point"
  # Every *.brick name goes through the front door (front-door/). From
  # 2026-10-17 23:53 to 2026-10-19 it served Traefik's self-signed
  # certificate instead of Caddy's and nothing noticed: the caddy job
  # scrapes inside the cluster, so it stayed up. The front-door job takes
  # the way a browser does, and fails on a wrong certificate, a missing
  # address, or a second host answering for 192.168.1.221.
  brick-front-door:
    groups:
      - name: brick-front-door
        rules:
          - alert: FrontDoorDown
            expr: up{job="front-door"} == 0 or absent(up{job="front-door"})
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "https://*.brick.nozdormu.cloud has failed for 5 minutes: check the certificate (`openssl s_client`), front-door/caddy's EXTERNAL-IP and who answers ARP for 192.168.1.221"
  # The bedroom's SHT35 is read on brick1982 (rpi_lcars) and copied into
  # Home Assistant. HA started while brick1982 was off on 2026-10-23 and its
  # copy stayed unavailable for three days with the sensor fine and nothing
  # noticing (home-assistant#9). HA's watchdog now restarts it after 15
  # minutes; this fires if that didn't work. An absent HA series counts as
  # unavailable (a platform that never set up has no entity).
  brick-home-assistant:
    groups:
      - name: brick-home-assistant
        rules:
          - alert: BedroomSensorMissingInHomeAssistant
            expr: |
              lcars_room_sensor_up == 1
              unless on() (hass_entity_available{entity="sensor.bedroom_temperature"} == 1)
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "brick1982's room sensor has read for 30 minutes but Home Assistant's sensor.bedroom_temperature is unavailable: its watchdog didn't fix it; kubectl -n home-assistant rollout restart deploy/home-assistant"
          # A Google timeout burst (2026-10-27) hung HA's Google Calendar
          # integration for three days, silently; only a restart fixed it.
          # HA's calendar watchdog now restarts it after 45 minutes (at most
          # every 2 hours); this fires if that didn't work, or Google itself
          # has been down for hours. A calendar that never set up has no
          # series, so it counts as unavailable.
          - alert: GoogleCalendarMissingInHomeAssistant
            expr: |
              up{job="home-assistant/home-assistant"} == 1
              unless on() (max(hass_entity_available{domain="calendar"}) == 1)
            for: 3h
            labels:
              severity: warning
            annotations:
              summary: "Home Assistant is up but no calendar has been available for 3 hours: its watchdog didn't fix it; check the Google Calendar integration, then delete the home-assistant pod"
