    <main>
      <header>
        <h1>brick</h1>
        <p id="count"></p>
      </header>
      <div class="wall" id="wall"></div>
    </main>

    <dialog id="sheet" aria-labelledby="sheet-name">
      <div class="plate" id="plate"><svg class="face" viewBox="0 0 240 114" aria-hidden="true"><use id="sheet-face"/></svg></div>
      <div class="body">
        <h2 id="sheet-name"></h2>
        <ul id="sheet-points"></ul>
        <div class="actions">
          <a class="go" id="sheet-go"></a>
          <button class="close" type="button" id="sheet-close">Close</button>
        </div>
      </div>
    </dialog>

    <script>
      // One entry per service. To add one: a line here and an m-<id> drawing above.
      const services = [
        {id: "status", name: "Status board", glaze: "#2fbf55", on: "#08230f", points: [
          "The board from brick9000's screen, read-only",
          "Shows builds, cluster health and the last wardriving sync",
          "Shows CPU, memory, disk and temperature for each host"]},
        {id: "wigle", name: "Wardriving console", glaze: "#19c6d6", on: "#04262a", points: [
          "Tracks what each drive found, and what's new to you",
          "Reports on the last sync, with logs from recent runs",
          "Shows whether the Pi is in range and when the next sync runs"]},
        {id: "radar", name: "Drive replay", glaze: "#e8622c", on: "#2b0e02", points: [
          "Replays a drive over the streets of earlier drives",
          "Filters by Wi-Fi, BLE and Bluetooth",
          "Shows sightings over time, and plays them back faster"]},
        {id: "overwatch", name: "Overwatch", glaze: "#f2c21b", on: "#2a2000", points: [
          "Watches for Bluetooth trackers and gadgets nearby",
          "Compares what it hears with what's usual, and raises alerts",
          "Watches for Wi-Fi attacks and unexpected port forwards"]},
        {id: "homeassistant", name: "Home Assistant", glaze: "#18a6e8", on: "#04222f", points: [
          "Talks to the thermostat over HomeKit",
          "Gives the wall panel its readings and controls",
          "Keeps the panel's changes within safe limits"]},
        {id: "reader", name: "Joke reader", glaze: "#e0408a", on: "#2c0518", points: [
          "Browses the Chuck Norris jokes the importer stored",
          "Filters by category or text",
          "Reloads from the database on request"]},
        {id: "volume", name: "Speaker volume", glaze: "#7fae8a", on: "#0f2015", points: [
          "Sets the volume of brick9000's speaker",
          "Mutes it with one press",
          "Has a hardware twin: the volume dial"]},
        {id: "grafana", name: "Grafana", glaze: "#f46800", on: "#2b1200", points: [
          "Dashboards for hosts, apps and builds",
          "Searches every service's logs",
          "Follows a request through its traces"]},
        {id: "prometheus", name: "Prometheus", glaze: "#d8492a", on: "#fff", points: [
          "Stores the metrics behind the dashboards",
          "Runs ad hoc queries and graphs them",
          "Shows which alerts are firing"]},
        {id: "jenkins", name: "Jenkins", glaze: "#c9352f", on: "#fff", points: [
          "Builds and publishes the app images",
          "Runs the nightly tests and image checks",
          "Deploys to brick9000 and brick1982",
          "Asks you to sign in"]},
        {id: "argocd", name: "Argo CD", glaze: "#18be94", on: "#03261d", points: [
          "Deploys the cluster from git",
          "Shows what's synced and healthy, app by app",
          "Shows which apps are trying out a branch"]},
        {id: "dashboard", name: "Kubernetes Dashboard", glaze: "#326ce5", on: "#fff", points: [
          "Browses the cluster's pods, deployments and nodes",
          "Reads a pod's logs and events",
          "Asks you to sign in"]},
      ];

      const url = s => `https://${s.id}.brick.nozdormu.cloud`;
      const paint = (el, s) => { el.style.setProperty("--glaze", s.glaze); el.style.setProperty("--on", s.on); };
      const sheet = document.getElementById("sheet");
      const wall = document.getElementById("wall");

      function open(s) {
        paint(sheet, s);
        document.getElementById("sheet-face").setAttribute("href", `#m-${s.id}`);
        document.getElementById("sheet-name").textContent = s.name;
        const points = document.getElementById("sheet-points");
        points.replaceChildren(...s.points.map(p => {
          const li = document.createElement("li");
          li.textContent = p;
          return li;
        }));
        const go = document.getElementById("sheet-go");
        go.href = url(s);
        go.textContent = `${s.id}.brick.nozdormu.cloud`;
        sheet.showModal();
      }

      for (const s of services) {
        const brick = document.createElement("button");
        brick.className = "brick";
        brick.type = "button";
        paint(brick, s);
        brick.innerHTML = `<svg class="face" viewBox="0 0 240 114" aria-hidden="true"><use href="#m-${s.id}"/></svg><span class="stamp"></span>`;
        brick.querySelector(".stamp").textContent = s.name;
        brick.addEventListener("click", () => open(s));
        wall.append(brick);
      }
      document.getElementById("count").textContent = `${services.length} services on the wall. Pick a brick to see what it does.`;
      document.getElementById("sheet-close").addEventListener("click", () => sheet.close());
      sheet.addEventListener("click", e => { if (e.target === sheet) sheet.close(); });
    </script>
    </body>
    </html>
