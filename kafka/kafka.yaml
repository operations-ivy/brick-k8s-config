# The brick-kafka Kafka cluster (KRaft, no ZooKeeper), run by the Strimzi
# operator (strimzi/, apps/strimzi.yaml) and synced by apps/kafka.yaml.
# Clients connect to kafka-kafka-bootstrap.brick-kafka.svc: 9092 plain,
# 9093 TLS.
#
# Three nodes, each both controller and broker, so a topic with replication
# factor 3 survives one node down. Their volumes are local-path, so all three
# run on brick2000 (docs: placement): that covers a pod restarting or a disk
# write failing, not brick2000 going down.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: kafka
  namespace: brick-kafka
  labels:
    # The name of the Kafka below: it's what puts these nodes in that cluster.
    strimzi.io/cluster: kafka
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 5Gi
        # Strimzi keeps the volumes if the pool or the cluster is deleted.
        deleteClaim: false
        kraftMetadata: shared
  # Heap kept small for the cluster's budget (wigle-sync#21); the limit
  # leaves room for the page cache and off-heap buffers.
  jvmOptions:
    -Xms: 512m
    -Xmx: 512m
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 1536Mi
  template:
    pod:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: chuck.io/storage-node
                operator: In
                values: ["true"]
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
  namespace: brick-kafka
spec:
  kafka:
    version: 4.3.1
    metadataVersion: 4.3-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}
    # Stateless: off brick2000 where it can be, never brick420.
    template:
      pod:
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                - key: chuck.io/storage-node
                  operator: NotIn
                  values: ["true"]
