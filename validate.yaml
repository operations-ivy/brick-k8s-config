# What scripts/validate checks (brick-k8s-config#30). Chart versions are the
# ones running on the cluster; bump them here when upgrading a release.
releases:
  - {name: kube-prometheus-stack, namespace: monitoring, chart: prometheus-community/kube-prometheus-stack, version: 91.5.0, values: monitoring/kube-prometheus-stack/kube-prometheus-stack-values.yaml}
  - {name: loki, namespace: monitoring, chart: grafana/loki, version: 7.3.0, values: monitoring/loki/loki-values.yaml}
  - {name: tempo, namespace: monitoring, chart: grafana/tempo, version: 1.24.4, values: monitoring/tempo/tempo-values.yaml}
  - {name: otel-collector, namespace: monitoring, chart: open-telemetry/opentelemetry-collector, version: 0.173.1, values: monitoring/otel-collector/otel-collector-values.yaml}
  - {name: promtail, namespace: monitoring, chart: grafana/promtail, version: 6.17.1, values: monitoring/promtail/promtail-values.yaml}
  - {name: pushgateway, namespace: monitoring, chart: prometheus-community/prometheus-pushgateway, version: 3.9.0, values: monitoring/pushgateway/pushgateway-values.yaml}
  - {name: node-feature-discovery, namespace: node-feature-discovery, chart: nfd/node-feature-discovery, version: 0.19.0, values: nfd/nfd-values.yaml}
  - {name: argocd, namespace: argocd, chart: argo/argo-cd, version: 10.10.5, values: argocd/argocd-values.yaml}
  - {name: sealed-secrets, namespace: sealed-secrets, chart: oci://registry-1.docker.io/bitnamicharts/sealed-secrets, version: 2.20.0, values: secrets/sealed-secrets/sealed-secrets-values.yaml}
  - {name: strimzi, namespace: strimzi, chart: oci://quay.io/strimzi-helm/strimzi-kafka-operator, version: 1.3.0, values: strimzi/strimzi-values.yaml}

# Values whose contents the chart passes through as free-form config, so
# their keys can't be checked against the chart's defaults.
freeform:
  - loki.limits_config        # Loki's own limits config, rendered as-is
  - config                    # otel-collector: the collector's own config
  - configs.params            # Argo CD: argocd-cmd-params-cm, rendered as-is
  - configs.cm                # Argo CD: argocd-cm, rendered as-is

# Manifests applied by hand only while debugging: checked, but their absence
# from the cluster isn't drift.
not_deployed:
  - debug/

# Manifests Argo CD doesn't manage, so --cluster diffs them itself: k3s's own
# Traefik config stays with k3s (#42). Everything else is an Argo CD
# Application, and --cluster asks Argo CD whether it matches main.
unmanaged:
  - traefik/
