# The sealed-secrets controller: it decrypts every SealedSecret, so its key
# (the sealed-secrets-key* Secrets it made itself) is never in git and never
# tracked here. Chart from Bitnami's OCI registry (no oci:// prefix for Argo),
# pinned here and in validate.yaml; values from git.
#
# Automated (#42), but without prune: nothing here should ever be deleted by
# a sync, only on purpose.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: registry-1.docker.io/bitnamicharts
      chart: sealed-secrets
      targetRevision: 2.20.0
      helm:
        releaseName: sealed-secrets
        valueFiles:
          - $values/secrets/sealed-secrets/sealed-secrets-values.yaml
    - repoURL: https://github.com/operations-ivy/brick-k8s-config.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
