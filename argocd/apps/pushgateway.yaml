# The pushgateway Helm release: chart pinned here, values from git
# (monitoring/pushgateway/pushgateway-values.yaml). Bump the chart here and in validate.yaml together.
#
# Manual sync until it has shown no diff against what's live (#42).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pushgateway
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-pushgateway
      targetRevision: 3.9.0
      helm:
        releaseName: pushgateway
        valueFiles:
          - $values/monitoring/pushgateway/pushgateway-values.yaml
    - repoURL: https://github.com/operations-ivy/brick-k8s-config.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
