# The promtail Helm release: chart pinned here, values from git
# (monitoring/promtail/promtail-values.yaml). Bump the chart here and in validate.yaml together.
#
# Manual sync until it has shown no diff against what's live (#42).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: promtail
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: promtail
      targetRevision: 6.17.1
      helm:
        releaseName: promtail
        valueFiles:
          - $values/monitoring/promtail/promtail-values.yaml
    - repoURL: https://github.com/operations-ivy/brick-k8s-config.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
