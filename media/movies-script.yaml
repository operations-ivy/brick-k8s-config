# Generated from media/'s scripts by scripts/media-configmap: edit a script,
# then run that (tests/test_media.py fails until they match).
apiVersion: v1
kind: ConfigMap
metadata:
  name: movies-script
  namespace: media
data:
  convert-480p.sh: |
    #!/bin/bash
    # Converts every video under $SRC to a 480p H.264/AAC MP4 under $DST, at the
    # same relative path: the Retroid's screen is 640x480, so a 480p copy looks the
    # same there at a quarter of the size. Run by media/movies-cronjob.yaml.
    #
    # - Done once: a copy that exists is skipped, so each run only does new files.
    # - Whole or not at all: ffmpeg writes a dotted .part file, renamed when done.
    # - A file still being copied in (changed in the last $SETTLE seconds) waits
    #   for the next run.
    # - A file ffmpeg can't convert gets a <name>.mp4.failed marker and is skipped
    #   from then on; delete the marker to try again.
    # - The English audio track if there is one (a dual-audio file's first track is
    #   often Japanese), else the first.
    # - Text subtitles are kept; if the subtitles can't be converted (picture
    #   subtitles, such as a Blu-ray's), the copy is made without them.
    # - Originals are never changed or deleted.
    # - Pictures, subtitles and metadata files are copied beside the copies.
    # - One run at a time (a lock file in $DST), however the run was started.
    # - Two videos with one name in one folder (X.mkv and X.mp4; the stems
    #   compared ignoring ASCII case, as exFAT does): the first in byte order keeps
    #   X.mp4, which is the copy this script already made of it, and each other
    #   gets X.<its extension>.mp4 (X.mp4.mp4). A "same name:" line says so.
    set -u
    SRC=${SRC:-/movies/library}
    DST=${DST:-/movies/480p}
    SETTLE=${SETTLE:-600}
    THREADS=${THREADS:-2}
    PRESET=${PRESET:-medium}  # x264 preset: veryfast is about twice as fast, files ~20-30% bigger

    audio_track() {  # audio_track <input>: "0:<index>" of an English audio track, or nothing
        local index
        index=$(ffprobe -v error -select_streams a -show_entries stream=index:stream_tags=language \
            -of csv=p=0 "$1" | awk -F, 'tolower($2) == "eng" || tolower($2) == "en" { print $1; exit }')
        [ -n "$index" ] && echo "0:$index"
    }

    encode() {  # encode <input> <output> [subtitle options...]
        local in=$1 out=$2 audio
        shift 2
        audio=$(audio_track "$in")
        nice -n 19 ffmpeg -nostdin -hide_banner -loglevel error -y -i "$in" \
            -map 0:v:0 -map "${audio:-0:a:0?}" "$@" \
            -vf "scale='trunc(ih*dar/2)*2':ih,setsar=1,scale=-2:'min(480,ih)',setsar=1" \
            -c:v libx264 -preset "${PRESET:-medium}" -crf 22 -pix_fmt yuv420p -threads "$THREADS" \
            -c:a aac -ac 2 -b:a 128k -movflags +faststart -f mp4 "$out"
    }

    declare -A OWNER  # "<folder>/<stem, ASCII lowercase>" -> the video that keeps <stem>.mp4

    name_key() {  # name_key <rel>: the folder and the stem in ASCII lowercase (exFAT ignores case)
        local LC_ALL=C stem=${1##*/}
        stem=${stem%.*}
        if [[ $1 == */* ]]; then printf '%s/%s' "${1%/*}" "${stem,,}"; else printf '%s' "${stem,,}"; fi
    }

    claim_names() {  # claim_names <rel>...: the first of each name (in byte order) keeps it
        local LC_ALL=C rel key
        for rel in "$@"; do
            key=$(name_key "$rel")
            if [[ -z ${OWNER[$key]+set} || $rel < ${OWNER[$key]} ]]; then
                OWNER[$key]=$rel
            fi
        done
    }

    output_rel() {  # output_rel <rel>: the 480p copy's path under $DST (after claim_names)
        local key
        key=$(name_key "$1")
        if [[ ${OWNER[$key]-$1} == "$1" ]]; then printf '%s.mp4' "${1%.*}"; else printf '%s.mp4' "$1"; fi
    }

    # Sourced (tests/test_media.py): define the functions only.
    [[ "${BASH_SOURCE[0]}" != "$0" ]] && return 0

    mkdir -p "$SRC" "$DST"
    # One run at a time, even a Job started by hand beside the CronJob's own
    # (concurrencyPolicy only counts the CronJob's Jobs): two runs would write the
    # same .part file. Both pods are on brick2000, so a local flock covers it.
    exec 9>"$DST/.convert.lock"
    if ! flock -n 9; then
        echo "another run is converting; nothing to do"
        exit 0
    fi
    converted=0 failed=0 waiting=0 present=0

    rels=()
    while IFS= read -r -d '' in; do
        rels+=("${in#"$SRC"/}")
    done < <(find "$SRC" -type f ! -name '.*' \( -iname '*.mkv' -o -iname '*.mp4' -o -iname '*.m4v' \
        -o -iname '*.avi' -o -iname '*.mov' -o -iname '*.webm' -o -iname '*.ts' -o -iname '*.wmv' -o -iname '*.mpg' -o -iname '*.mpeg' \) -print0 | LC_ALL=C sort -z)
    claim_names "${rels[@]}"

    for rel in "${rels[@]}"; do
        in="$SRC/$rel"
        out="$DST/$(output_rel "$rel")"
        owner=${OWNER[$(name_key "$rel")]}
        [[ $owner != "$rel" ]] && echo "same name: $rel -> ${out#"$DST"/} ($owner keeps ${owner%.*}.mp4)"
        if [ -e "$out" ]; then present=$((present + 1)); continue; fi
        [ -e "$out.failed" ] && continue
        # Claimed by a worker on another node (convert-server.py), within 6 hours.
        claim="$DST/.claims/$(printf '%s' "$rel" | sha1sum | cut -c1-40)"
        [ -n "$(find "$claim" -mmin -360 2>/dev/null)" ] && continue
        if [ $(($(date +%s) - $(stat -c %Y "$in"))) -lt "$SETTLE" ]; then
            waiting=$((waiting + 1))
            continue
        fi
        mkdir -p "$(dirname "$out")"
        part="$(dirname "$out")/.$(basename "$out").part"
        echo "converting: $rel"
        start=$(date +%s)
        if encode "$in" "$part" -map '0:s?' -c:s mov_text || encode "$in" "$part" -sn; then
            mv -f "$part" "$out"
            converted=$((converted + 1))
            echo "done: $rel ($(($(date +%s) - start)) s, $(($(stat -c %s "$out") >> 20)) MB)"
        else
            rm -f "$part"
            : > "$out.failed"
            failed=$((failed + 1))
            echo "failed: $rel"
        fi
    done

    # Pictures, subtitles and metadata beside the videos (poster.jpg, X.jpg, X.srt,
    # info.json, X.nfo: homelab-context scripts/media-ingest ships them) follow to
    # the same path under $DST, so the handhelds' copies keep them. Copied again
    # when the original is newer; never converted.
    sidecars=0
    while IFS= read -r -d '' in; do
        out="$DST/${in#"$SRC"/}"
        [ -e "$out" ] && ! [ "$in" -nt "$out" ] && continue
        mkdir -p "$(dirname "$out")"
        cp -p "$in" "$out" && sidecars=$((sidecars + 1))
    done < <(find "$SRC" -type f ! -name '.*' \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \
        -o -iname '*.srt' -o -iname '*.ass' -o -iname '*.vtt' -o -iname '*.nfo' -o -name 'info.json' \) -print0)

    echo "summary: converted=$converted failed=$failed waiting=$waiting already=$present sidecars=$sidecars"
  convert-server.py: |
    #!/usr/bin/env python3
    """Hands out the 480p backlog to convert-worker.sh on other nodes (media/convert-workers.yaml).

    Runs on brick2000 beside the files. Standard library only.

        POST /claim        the next video to convert: 200 with a claim id, or 204 when none
        GET  /file/<id>    the claimed original
        PUT  /done/<id>    the finished 480p copy: written as a dotted .part, then renamed
        POST /fail/<id>    ffmpeg couldn't convert it: a .failed marker, like convert-480p.sh's
        GET  /health

    A claim is a file in $DST/.claims named by the sha1 of the video's path under
    $SRC; convert-480p.sh skips claimed videos too, so no video is converted twice.
    Workers take the backlog from the end, the CronJob from the start. A claim
    older than CLAIM_HOURS is a worker that died: the video is handed out again.

    Copies are named as convert-480p.sh names them: X.mkv -> X.mp4, but when a
    folder has two videos of one name (X.mkv and X.mp4), only the first in byte
    order gets X.mp4 and the others X.<extension>.mp4.
    """

    import hashlib
    import os
    import re
    import shutil
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from pathlib import Path

    SRC = Path(os.environ.get("SRC", "/movies/library"))
    DST = Path(os.environ.get("DST", "/movies/480p"))
    SETTLE = int(os.environ.get("SETTLE", "600"))
    CLAIM_HOURS = float(os.environ.get("CLAIM_HOURS", "6"))
    EXTS = {".mkv", ".mp4", ".m4v", ".avi", ".mov", ".webm", ".ts", ".wmv", ".mpg", ".mpeg"}
    CHUNK = 1 << 20
    CLAIM_ID = re.compile(r"[0-9a-f]{40}")


    def claim_id(rel: str) -> str:
        return hashlib.sha1(rel.encode()).hexdigest()


    def is_video(path: Path) -> bool:
        return not path.name.startswith(".") and path.suffix.lower() in EXTS and path.is_file()


    def name_key(name: str) -> bytes:
        """A video's stem, ASCII lowercase (exFAT ignores case), as convert-480p.sh's name_key."""
        return Path(name).stem.encode().lower()


    def output(rel: str) -> Path:
        """The 480p copy of rel: <stem>.mp4, or <name>.mp4 when an earlier video in
        byte order (convert-480p.sh's LC_ALL=C sort) has the same stem."""
        path = Path(rel)
        name, key = path.name.encode(), name_key(path.name)
        try:
            siblings = [p.name.encode() for p in (SRC / path.parent).iterdir() if name_key(p.name) == key and is_video(p)]
        except FileNotFoundError:  # the folder was removed while a worker had the video
            siblings = []
        if min(siblings, default=name) == name:
            return DST / path.with_suffix(".mp4")
        return DST / path.with_name(path.name + ".mp4")


    def claimed(rel: str, now: float) -> bool:
        claim = DST / ".claims" / claim_id(rel)
        return claim.exists() and now - claim.stat().st_mtime < CLAIM_HOURS * 3600


    def pending(now: float) -> list[str]:
        """Videos with no 480p copy, no .failed marker, no claim and not being
        converted by the CronJob (its dotted .part), newest-name first."""
        todo = []
        for path in SRC.rglob("*"):
            if not is_video(path):
                continue
            rel = str(path.relative_to(SRC))
            out = output(rel)
            if (out.exists() or out.with_name(out.name + ".failed").exists()
                    or out.with_name(f".{out.name}.part").exists() or claimed(rel, now)
                    or now - path.stat().st_mtime < SETTLE):
                continue
            todo.append(rel)
        return sorted(todo, reverse=True)


    def claim(now: float) -> str | None:
        """Claim the next video; its id, or None. O_EXCL: two workers can't take the same one."""
        (DST / ".claims").mkdir(parents=True, exist_ok=True)
        for rel in pending(now):
            path = DST / ".claims" / claim_id(rel)
            # pending() leaves out live claims, so a claim file here is a stale one.
            path.unlink(missing_ok=True)
            try:
                fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL)
            except FileExistsError:
                continue
            with os.fdopen(fd, "w") as f:
                f.write(rel)
            return path.name
        return None


    def claimed_rel(cid: str) -> str | None:
        path = DST / ".claims" / cid
        if not CLAIM_ID.fullmatch(cid) or not path.is_file():
            return None
        return path.read_text()


    def release(cid: str) -> None:
        (DST / ".claims" / cid).unlink(missing_ok=True)


    class Handler(BaseHTTPRequestHandler):
        def log_message(self, fmt: str, *args: object) -> None:
            print(f"{self.address_string()} {fmt % args}", flush=True)

        def reply(self, status: int, body: bytes = b"") -> None:
            self.send_response(status)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def route(self) -> tuple[str, str]:
            parts = self.path.strip("/").split("/")
            return parts[0], parts[1] if len(parts) > 1 else ""

        def do_GET(self) -> None:
            what, cid = self.route()
            if what == "health":
                self.reply(200, b"ok")
                return
            rel = claimed_rel(cid) if what == "file" else None
            src = SRC / rel if rel else None
            if not src or not src.is_file():  # unknown claim, or the original was removed
                self.reply(404)
                return
            self.send_response(200)
            self.send_header("Content-Length", str(src.stat().st_size))
            self.end_headers()
            with src.open("rb") as f:
                shutil.copyfileobj(f, self.wfile, CHUNK)

        def do_POST(self) -> None:
            what, cid = self.route()
            if what == "claim":
                got = claim(time.time())
                if got:
                    self.reply(200, got.encode())
                else:
                    self.reply(204)
                return
            rel = claimed_rel(cid) if what == "fail" else None
            if not rel:
                self.reply(404)
                return
            out = output(rel)
            out.parent.mkdir(parents=True, exist_ok=True)
            out.with_name(out.name + ".failed").touch()
            release(cid)
            print(f"failed: {rel}", flush=True)
            self.reply(200)

        def do_PUT(self) -> None:
            what, cid = self.route()
            rel = claimed_rel(cid) if what == "done" else None
            length = int(self.headers.get("Content-Length", "0"))
            if not rel:
                self.reply(404)
                return
            if length <= 0:
                self.reply(400)
                return
            out = output(rel)
            out.parent.mkdir(parents=True, exist_ok=True)
            part = out.with_name(f".{out.name}.remote.part")
            left = length
            with part.open("wb") as f:
                while left:
                    block = self.rfile.read(min(CHUNK, left))
                    if not block:
                        break
                    f.write(block)
                    left -= len(block)
            if left:  # the upload stopped short
                part.unlink(missing_ok=True)
                self.reply(400)
                return
            part.rename(out)
            release(cid)
            print(f"done: {rel} ({length >> 20} MB)", flush=True)
            self.reply(200)


    def main() -> None:
        server = ThreadingHTTPServer(("", int(os.environ.get("PORT", "8080"))), Handler)
        print(f"serving {SRC} -> {DST}", flush=True)
        server.serve_forever()


    if __name__ == "__main__":
        main()
  convert-worker.sh: |
    #!/bin/bash
    # A 480p converter for another node (media/convert-workers.yaml) or any machine
    # that can reach convert-server.py: claim a video, fetch it, convert it with
    # convert-480p.sh's own encode (same settings, the English audio track), send
    # the copy back, repeat. Nothing to do: wait and ask again.
    #
    #   SERVER   convert-server.py's address (default http://movies-convert-server:8080)
    #   WORK     scratch space for one video and its copy (default /work)
    #   THREADS  ffmpeg threads (default 2)
    #   SCRIPT   convert-480p.sh, sourced for encode (default /scripts/convert-480p.sh)
    set -u
    SERVER=${SERVER:-http://movies-convert-server:8080}
    WORK=${WORK:-/work}
    SCRIPT=${SCRIPT:-/scripts/convert-480p.sh}
    IDLE=${IDLE:-600}
    # shellcheck source=convert-480p.sh
    source "$SCRIPT"
    mkdir -p "$WORK"

    while true; do
        id=$(curl -fsS -X POST "$SERVER/claim") || { sleep 60; continue; }
        if [ -z "$id" ]; then
            sleep "$IDLE"
            continue
        fi
        rm -f "$WORK"/in "$WORK"/out.mp4
        start=$(date +%s)
        if ! curl -fsS -o "$WORK/in" "$SERVER/file/$id"; then
            echo "fetch failed: $id (the claim expires and the video is handed out again)"
            sleep 60
            continue
        fi
        if encode "$WORK/in" "$WORK/out.mp4" -map '0:s?' -c:s mov_text || encode "$WORK/in" "$WORK/out.mp4" -sn; then
            curl -fsS -X PUT -T "$WORK/out.mp4" "$SERVER/done/$id" >/dev/null &&
                echo "done: $id ($(($(date +%s) - start)) s, $(($(stat -c %s "$WORK/out.mp4") >> 20)) MB)"
        else
            curl -fsS -X POST "$SERVER/fail/$id" >/dev/null
            echo "failed: $id"
        fi
        rm -f "$WORK"/in "$WORK"/out.mp4
    done
