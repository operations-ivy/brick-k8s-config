# The brick homelab's history, for timeline.brick.nozdormu.cloud (TimelineJS3).
#
# Curated: the story, worked out from the git history of the operations-ivy
# repos (before 2026-10-10) and the session notes kept since. Told in chapters;
# each milestone says why it happened and links what caused it. The merged pull
# requests of the public repos, from the hourly timeline-feed job
# (front-door/timeline/feed.py), count per chapter and show on request.
#
# This repo is public: features only. No addresses, credentials or anything
# about people. Add a milestone when something ships that changes how the
# homelab works; the PR feed covers the rest.
#
# Chapters: start/end dates (the last has no end: it runs to today), a colour
# for its band in the track, its art, and the story that opens it.
#
# Events:
#   date: YYYY-MM-DD   group: one of the rows below   headline, text (HTML allowed)
#   id: optional, for linking   after: optional, the id of the milestone that led to it
#   art: optional, a picture from art/ (art-<name>.svg); each row has a default
title:
  headline: brick, from the start
  text: >-
    How a practice repo became a three-node Raspberry Pi cluster with an arcade
    cabinet, wall panels and a desk display. Seven chapters, a crash in the
    middle, and the threads that tie it together.

groups: [Chapters, Origins, Cluster, Delivery, Apps, Cabinet, Displays]

# Each row's picture (art/art-<name>.svg), and its colour in the track.
rows:
  Chapters: {art: title, colour: "#ffffff"}
  Origins: {art: origins, colour: "#ffb300"}
  Cluster: {art: cluster, colour: "#39ff6a"}
  Delivery: {art: delivery, colour: "#00eaff"}
  Apps: {art: apps, colour: "#ff2bd6"}
  Cabinet: {art: cabinet, colour: "#ff3355"}
  Displays: {art: displays, colour: "#cc99ff"}

chapters:
  - start: 2023-12-27
    end: 2025-03-24
    headline: Practice
    colour: "#ffb300"
    art: origins
    story: >-
      It starts as a practice repo, project_viper: Python, SQLite and small
      APIs, then Flask apps on minikube and Kafka experiments. Nothing here runs
      a homelab yet, but most of what comes later is tried here first.
  - start: 2025-03-25
    end: 2025-05-31
    headline: The first cluster
    colour: "#39ff6a"
    art: cluster
    story: >-
      Practice turns into a project. A joke importer leaves for a repo of its
      own, gets a container and a real database, and needs somewhere to run: a
      Raspberry Pi cluster, with a configuration repo, a runbook and its first
      metrics.
  - start: 2025-06-01
    end: 2026-09-14
    headline: Quiet
    colour: "#5b7799"
    art: origins
    story: >-
      Fifteen months with almost nothing in git. When the work picks up again
      it's on new hardware, and it doesn't slow down.
  - start: 2026-09-15
    end: 2026-10-09
    headline: The build-out
    colour: "#00eaff"
    art: delivery
    story: >-
      Three weeks on new Raspberry Pi 5s. Monitoring, tracing and sealed
      secrets; a wardriving uploader; Jenkins and a status board on the
      cabinet's screen; every web UI at its own name over HTTPS. By the end
      it's a homelab, not a practice cluster.
  - start: 2026-10-10
    end: 2026-10-16
    headline: Written down
    colour: "#ff2bd6"
    art: apps
    story: >-
      homelab-context starts: one record of how everything works, read at the
      start of every working session. The pace changes with it. Within a week
      there are games on the cabinet, a tracker watch, a wall panel, and every
      workload deploys from git.
  - start: 2026-10-17
    end: 2026-10-26
    headline: The crash
    colour: "#ff3355"
    art: cabinet
    story: >-
      The cabinet's HAT dies, and brick9000 was the front door for every name:
      nothing answers. That afternoon the front door moves onto the cluster,
      and the rule from then on is that nothing the homelab needs depends on one
      host. Nine days later the cabinet comes back.
  - start: 2026-10-27
    headline: Lights and screens
    colour: "#cc99ff"
    art: displays
    story: >-
      With the cabinet back, the homelab grows things to touch and look at:
      button lights anything can signal through, buttons that do things, a desk
      display, a redesigned board. It also learns to look after itself: a
      Wi-Fi watchdog, a heat warning that no longer keeps itself up.

events:
  # --- Practice ------------------------------------------------------------
  - date: 2023-12-27
    group: Origins
    id: viper
    headline: project_viper starts
    text: >-
      A catch-all practice repo for Python, SQLite and small APIs. It has no
      plan, and it doesn't need one: most of what follows starts as an
      experiment in here.
  - date: 2024-02-07
    group: Origins
    id: minikube
    after: viper
    headline: First steps with Kubernetes
    text: >-
      Practice Flask apps on minikube, a one-machine Kubernetes. The idea that
      apps should run on a cluster, not on a host, starts here.
  - date: 2024-02-26
    group: Origins
    id: jokes
    after: viper
    headline: The joke importer
    text: >-
      SQLite middleware and a script that imports jokes, with tests by March.
      A toy, but the first thing with data worth keeping: the seed of
      chucks-wisdom.
  - date: 2025-02-11
    group: Origins
    id: kafka-practice
    after: viper
    headline: Kafka experiments
    text: >-
      Producers and consumers in project_viper. Kafka won't run on the cluster
      for another twenty months.
  - date: 2025-03-22
    group: Origins
    id: tiny-screens
    headline: A host and port printer for tiny Pi screens
    text: >-
      A terminal display for small Raspberry Pi screens. Something to glance
      at instead of logging in: the first of the homelab's screens.

  # --- The first cluster -----------------------------------------------------
  - date: 2025-03-25
    group: Apps
    id: chucks
    after: jokes
    headline: chucks-wisdom breaks out
    text: >-
      The joke importer leaves project_viper for its own repo and is in a
      container within days. Now it needs somewhere to run.
  - date: 2025-04-13
    group: Apps
    after: chucks
    headline: chucks-wisdom moves to Postgres
    text: >-
      SQLite swapped for Postgres: a real database, and the first stateful
      workload the cluster will have to look after.
  - date: 2025-05-03
    group: Cluster
    id: k8s-config
    after: minikube
    headline: brick-k8s-config starts
    text: >-
      The cluster gets a configuration repo. A week later each app's manifests
      move to the app's own repo, the split every app still follows.
  - date: 2025-05-12
    group: Cluster
    after: k8s-config
    headline: Recovery steps written down
    text: >-
      The first runbook, in brick-k8s-config's README: how to bring the
      cluster back. Writing things down becomes a habit later; this is its
      first sign.
  - date: 2025-05-18
    group: Cluster
    id: first-metrics
    after: k8s-config
    headline: First monitoring, first metrics
    text: >-
      A first kube-prometheus-stack, and the joke importer instrumented. For
      the first time the cluster can say how it's doing.
  - date: 2025-05-24
    group: Displays
    id: lcars-fork
    after: tiny-screens
    headline: An LCARS interface on a Raspberry Pi
    text: >-
      A fork of the open-source rpi_lcars, made to run. It sits for seventeen
      months before it becomes the wall panel.

  # --- The build-out ---------------------------------------------------------
  - date: 2026-09-16
    group: Cluster
    id: pi5
    headline: Redeployed on Raspberry Pi 5s
    text: >-
      The quiet ends on new hardware. chucks-wisdom is hardened and its
      manifests cleaned up for the Pi 5 nodes, and the next three weeks build
      everything else around it.
  - date: 2026-09-19
    group: Cluster
    after: pi5
    headline: The Kubernetes dashboard on the LAN
    text: Served through Traefik instead of an SSH tunnel. The first web UI with an address of its own.
  - date: 2026-09-20
    group: Apps
    after: chucks
    headline: The reader's cyberpunk console
    text: >-
      chucks-wisdom's reader serves a neon console page from a live JSON API:
      the first of the homelab's neon screens.
  - date: 2026-09-21
    group: Cluster
    id: prometheus
    after: first-metrics
    headline: Prometheus and Grafana for real
    text: >-
      kube-prometheus-stack installed properly this time, and dashboards
      register themselves from labelled ConfigMaps: add a service, get its
      dashboard.
  - date: 2026-09-22
    group: Cluster
    id: tracing
    after: prometheus
    headline: Tracing, and sealed secrets
    text: >-
      Tempo and the OpenTelemetry Collector for traces. Credentials go into
      git only as SealedSecrets, so the configuration repos can be public.
  - date: 2026-09-24
    group: Apps
    id: wigle
    headline: wigle-sync
    art: radar
    text: >-
      A wardriving Pi logs Wi-Fi with Kismet; every hour the logs go up to
      WiGLE. Loki and the Pushgateway join the monitoring the same week, so a
      job that runs and exits still reports how it went.
  - date: 2026-09-26
    group: Delivery
    id: jenkins
    headline: Jenkins and the status board
    text: >-
      brick-cicd-config starts with Jenkins and brick-status, the board on
      brick9000's screen. Builds now happen somewhere you can watch.
  - date: 2026-09-28
    group: Delivery
    after: jenkins
    headline: Tests before every push
    text: Pull requests open with their test results. Nothing merges on faith.
  - date: 2026-10-02
    group: Cluster
    id: names
    headline: Every web UI at its own name over HTTPS
    text: >-
      <code>&lt;app&gt;.brick.nozdormu.cloud</code> for everything, with real
      certificates, all through Caddy on brick9000. The <code>.local</code>
      names start to retire. The front door now lives on one host; that
      matters on October 17.
  - date: 2026-10-07
    group: Apps
    after: wigle
    headline: The wardriving Pi bootstraps from git
    art: radar
    text: brick69 rebuilt from the wigle-sync repo alone. If it dies, git brings it back.
  - date: 2026-10-08
    group: Delivery
    id: jenkins-k8s
    after: jenkins
    headline: Jenkins moves onto the cluster
    text: The same jobs and webhooks, now a cluster workload instead of a host's.

  # --- Written down ------------------------------------------------------------
  - date: 2026-10-10
    group: Delivery
    id: context
    headline: homelab-context starts
    text: >-
      One shared, versioned record of how the homelab works, read at the start
      of every working session and updated at the end. Most of what follows is
      written down there, and this timeline is built from it.
  - date: 2026-10-10
    group: Apps
    id: radar
    after: wigle
    headline: The wardrive radar; two replicas everywhere
    art: radar
    text: >-
      wigle-console gets its radar, and the web apps run two replicas on
      different nodes, so losing a node doesn't take an app down.
  - date: 2026-10-11
    group: Cabinet
    id: games
    after: jenkins
    headline: Games on the cabinet
    text: >-
      RetroArch opens over the board when the controller turns on. The status
      board's screen becomes an arcade cabinet.
  - date: 2026-10-12
    group: Apps
    headline: overwatch
    after: wigle
    text: >-
      A Bluetooth tracker watch grows out of the wardriving work into an app of
      its own, then learns to spot Wi-Fi deauthentication floods.
  - date: 2026-10-13
    group: Cluster
    id: k8s-default
    headline: Kubernetes by default
    text: >-
      A rule: if it can run on the cluster, it does; host-only work needs a
      reason. The systemd units left on hosts get metrics.
  - date: 2026-10-15
    group: Displays
    id: panel
    after: lcars-fork
    headline: The LCARS panel and Home Assistant
    text: >-
      Seventeen months after the fork, brick1982 leaves the cluster to become a
      touchscreen LCARS wall panel. Home Assistant arrives with the thermostat.
  - date: 2026-10-16
    group: Delivery
    id: argo
    after: jenkins-k8s
    headline: GitOps with Argo CD
    text: >-
      Every Kubernetes workload deploys from git, and Argo CD puts back
      anything that drifts. Git is now what the cluster runs.
  - date: 2026-10-16
    group: Cabinet
    after: games
    headline: Five more consoles
    text: Sega CD, 32X, PSP, Dreamcast and Neo Geo on the cabinet, each measured first to check it keeps up.

  # --- The crash ---------------------------------------------------------------
  - date: 2026-10-17
    group: Cabinet
    id: crash
    after: names
    headline: brick9000 dies
    text: >-
      The cabinet's HAT fails. brick9000 is the status board, the arcade and
      the front door for every name, so every web UI goes dark with it.
  - date: 2026-10-17
    group: Cluster
    id: front-door
    after: crash
    art: cluster
    headline: The front door moves onto the cluster
    text: >-
      The same afternoon: Caddy and its certificates run on the cluster, and
      kube-vip holds the front door's address on whichever worker is up. A
      failover test moves it in about a second. Nothing the homelab needs
      depends on one host again.
  - date: 2026-10-20
    group: Cluster
    id: kube-vip
    after: front-door
    headline: kube-vip is the only load balancer
    text: >-
      k3s's built-in ServiceLB kept wiping the front door's status and taking
      every name down with it. It's switched off; kube-vip is the one load
      balancer, and hosts are called by name everywhere.
  - date: 2026-10-21
    group: Displays
    after: panel
    headline: The panel grows
    text: Calendar, house average, forecast and alerts on the LCARS panel, while the cabinet is away.
  - date: 2026-10-22
    group: Apps
    after: radar
    headline: brick69's status LEDs
    art: radar
    text: The wardriving Pi shows what it sees on its own LEDs, with no screen to look at.
  - date: 2026-10-24
    group: Delivery
    id: observe
    after: tracing
    headline: brick-observe 0.1.0
    text: >-
      Logs, metrics and traces had been wired up service by service. Now one
      library gives every service all three from a single call.
  - date: 2026-10-25
    group: Cluster
    after: kafka-practice
    headline: Kafka on the cluster
    text: >-
      Twenty months after the experiments in project_viper: the Strimzi
      operator and a KRaft cluster, as Argo CD apps.
  - date: 2026-10-26
    group: Cabinet
    id: back
    after: crash
    headline: The cabinet is back
    text: >-
      A new Picade X HAT, and the cabinet rewired from scratch. That night the
      button lights are plugged in for the first time.

  # --- Lights and screens -------------------------------------------------------
  - date: 2026-10-28
    group: Delivery
    id: one-line
    after: argo
    headline: One line per release
    text: Image tags single-sourced with Kustomize. A release is one line in git.
  - date: 2026-10-31
    group: Delivery
    after: one-line
    headline: Builds start from a push
    text: Every pushed branch builds its images; release branches build the tags they name. No more starting builds by hand.
  - date: 2026-10-31
    group: Apps
    after: radar
    headline: The wardrive atlas
    art: radar
    text: The radar gives way to a replay of each drive, on a map.
  - date: 2026-11-01
    group: Cluster
    after: names
    headline: The tile wall, and a new log pipeline
    text: brick.nozdormu.cloud becomes a wall of tiles, one per service. Alloy replaces Promtail for the logs.
  - date: 2026-11-01
    group: Cabinet
    id: plasma
    after: back
    headline: The plasma API
    text: >-
      The button lights from the night the cabinet came back get one service
      that owns them. Anything in the homelab can now signal through the
      cabinet's buttons.
  - date: 2026-11-03
    group: Cabinet
    id: buttons
    after: plasma
    headline: The cabinet's buttons do things
    text: Lit, and now useful. Sleep and wake on the side, check everything from the front.
  - date: 2026-11-03
    group: Delivery
    after: jenkins-k8s
    headline: Jenkins builds itself
    text: The Jenkins image is built and checked by its own pipeline.
  - date: 2026-11-03
    group: Displays
    id: presto
    after: tiny-screens
    art: presto
    headline: The Presto
    text: >-
      A Pimoroni Presto desk display with a neon home screen and four apps. The
      tiny-screen idea from March 2025, done properly.
  - date: 2026-11-04
    group: Displays
    after: presto
    art: presto
    headline: presto-photos on the cluster
    text: The Presto's photos come from a cluster service; days later it updates itself over Wi-Fi.
  - date: 2026-11-05
    group: Delivery
    headline: Maintenance windows
    text: >-
      Working on a device used to set off its alerts. Planned work now
      silences what it would set off.
  - date: 2026-11-05
    group: Displays
    after: panel
    headline: The lamp joins Home Assistant
    text: And gets a button on the cabinet the next day.
  - date: 2026-11-07
    group: Cluster
    headline: Images shared between nodes
    text: >-
      k3s's embedded registry (Spegel) on every node: a node can start a pod
      from an image another node already has. Old images are pruned nightly.
  - date: 2026-11-07
    group: Cabinet
    id: watchdog
    after: back
    headline: A Wi-Fi watchdog
    text: >-
      brick9000 kept dropping off the network: its Wi-Fi had lost the group key,
      so no broadcasts arrived. Now a watchdog re-activates the link after ten
      silent minutes, by itself.
  - date: 2026-11-08
    group: Cabinet
    id: redesign
    after: back
    art: cabinet
    headline: The board's redesign
    text: >-
      The status board takes on the console's neon look: near-black, VT323, a
      grid and a raster, TV static between screens.
  - date: 2026-11-08
    group: Delivery
    after: argo
    headline: Power-down, and change markers
    text: A job to take a node out of service and back; every build marked on the Grafana dashboards, so a change and its effect line up.
  - date: 2026-11-09
    group: Cabinet
    after: redesign
    headline: The cabinet stops cooking itself
    text: >-
      A Dreamcast session raised the heat warning, and the warning's own
      animated badge kept the board busy enough to stay hot: it held itself
      up. A static badge and a gap between raising and clearing broke the
      loop. The same day: the branch on the CRT's job card, RetroArch in the
      board's look, and button 5 to enlarge the CRT.
  - date: 2026-11-09
    group: Cluster
    after: context
    headline: This timeline
    text: >-
      timeline.brick.nozdormu.cloud: the story so far, drawn from a month of
      homelab-context's notes and two years of git history, and fed every hour
      by each merged pull request.
