# The reader and Postgres (its PVC is on brick2000). From operations-ivy/chucks-wisdom's k8s_config/ on main.
# The importer is a suspended CronJob in the kustomization: Argo manages it but
# it never fires on a schedule. Jenkins' chuck-importer job starts a one-shot
# Job from it (like wigle-sync-now); that Job self-deletes 10 minutes after
# finishing. (A plain Job here would be recreated by Argo in a loop.)
#
# Automated (#42): a merge to main is a deploy, a hand-made change is put
# back, and an object deleted from git is deleted here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chucks-wisdom
  namespace: argocd
spec:
  project: apps
  source:
    repoURL: https://github.com/operations-ivy/chucks-wisdom.git
    targetRevision: main
    path: k8s_config
    # Rendered with Kustomize, which Argo detects from k8s_config/kustomization.yaml.
    # No `kustomize: {}` here: the API server drops the empty object, so root
    # would see a diff it can never sync. The kustomization single-sources the
    # reader's image tag and lists only the manifests Argo should manage, so
    # the dashboards' .json sources and the importer Job are left out without a
    # directory exclude.
  destination:
    server: https://kubernetes.default.svc
    namespace: chuck
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
