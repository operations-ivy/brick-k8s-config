# The front door for every *.brick.nozdormu.cloud name, on the cluster since
# brick9000's hardware died (2026-10-17). The same Caddy as brick9000's
# (brick-cicd-config brick9000/proxy: Caddy with the Porkbun DNS plugin for
# the Let's Encrypt wildcard), at brick9000's old address 192.168.1.221
# (kube-vip.yaml), passing each name to Traefik in the cluster.
#
# The image is whitepatrick/brick-proxy on Docker Hub, built from
# brick-cicd-config's brick9000/proxy on brick2000's BuildKit (README, "Front
# door on the cluster"), pinned by digest. The pod runs on brick2000: its
# certificate lives on a local-path volume there.
apiVersion: v1
kind: Namespace
metadata:
  name: front-door
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddyfile
  namespace: front-door
data:
  Caddyfile: |
    {
    	auto_https disable_redirects
    	metrics {
    		per_host
    	}
    }
    # Traefik routes by the same host names (each app's ingress lists its own).
    (traefik) {
    	reverse_proxy traefik.kube-system.svc.cluster.local:80
    }
    # brick-status on brick9000 (by address: pods can't resolve the router's
    # bare host names). When brick9000 is down: the hosts dashboard in Grafana
    # for status, a 503 for volume.
    (brick9000) {
    	reverse_proxy 192.168.1.224:8765 {
    		lb_try_duration 2s
    	}
    }
    *.brick.nozdormu.cloud {
    	tls {
    		dns porkbun {
    			api_key {file./run/secrets/porkbun/api_key}
    			api_secret_key {file./run/secrets/porkbun/secret_key}
    		}
    	}
    	# The board's read-only mirror: brick-status on brick9000 (back on
    	# 192.168.1.224 since 2026-10-26), outside the cluster. It sees the
    	# X-Forwarded-For Caddy adds and never starts a cmatrix of its own.
    	@status host status.brick.nozdormu.cloud
    	handle @status {
    		import brick9000
    	}
    	# brick9000's speaker volume: brick-status's volume page, the only name
    	# it accepts volume changes through (its web.py, VOLUME_HOST).
    	@volume host volume.brick.nozdormu.cloud
    	handle @volume {
    		rewrite / /volume
    		import brick9000
    	}
    	# The Kubernetes Dashboard is only on Traefik's HTTPS entrypoint, behind
    	# a self-signed certificate; pass the name on explicitly.
    	@dashboard host dashboard.brick.nozdormu.cloud
    	handle @dashboard {
    		reverse_proxy https://traefik.kube-system.svc.cluster.local:443 {
    			header_up Host {host}
    			transport http {
    				tls_server_name dashboard.brick.nozdormu.cloud
    				tls_insecure_skip_verify
    			}
    		}
    	}
    	@apps host jenkins.brick.nozdormu.cloud argocd.brick.nozdormu.cloud grafana.brick.nozdormu.cloud prometheus.brick.nozdormu.cloud wigle.brick.nozdormu.cloud radar.brick.nozdormu.cloud reader.brick.nozdormu.cloud overwatch.brick.nozdormu.cloud homeassistant.brick.nozdormu.cloud
    	handle @apps {
    		import traefik
    	}
    	handle {
    		respond "No app here" 404
    	}
    	# brick9000 down: only status and volume; other names keep their errors.
    	handle_errors 502 503 504 {
    		@status_down host status.brick.nozdormu.cloud
    		handle @status_down {
    			redir https://grafana.brick.nozdormu.cloud/d/brick-hosts 302
    		}
    		@volume_down host volume.brick.nozdormu.cloud
    		handle @volume_down {
    			respond "brick9000 is down; its speaker's volume page comes back with it." 503
    		}
    	}
    }
    # The volume dial (brick-cicd-config volume-dial/) reads and sets the
    # volume over plain HTTP: an ESP32 takes ~2.7 s per TLS handshake, and
    # ESPHome's requests block the dial while they run. Only the API, only on
    # the LAN; the page itself still redirects to HTTPS.
    http://volume.brick.nozdormu.cloud {
    	handle /api/volume {
    		import brick9000
    	}
    	handle {
    		redir https://{host}{uri} 308
    	}
    }
    http://*.brick.nozdormu.cloud {
    	redir https://{host}{uri} 308
    }
    # Caddy's own metrics for Prometheus (the caddy scrape job, 192.168.1.221:9180).
    http://:9180 {
    	metrics /metrics
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-data
  namespace: front-door
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: front-door
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: caddy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caddy
      annotations:
        # Restart when the Caddyfile changes (bump by hand with it).
        brick/caddyfile-rev: "3"
    spec:
      nodeSelector:
        chuck.io/storage-node: "true"
      containers:
        - name: caddy
          image: docker.io/whitepatrick/brick-proxy:2.11.4-porkbun0.3.1@sha256:bac9e50ca632ce275372d5f0037c3c335b63d65785f2f26e0f6564eb7113831d
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 80}
            - {name: https, containerPort: 443}
            - {name: metrics, containerPort: 9180}
          volumeMounts:
            - {name: caddyfile, mountPath: /etc/caddy}
            - {name: data, mountPath: /data}
            - {name: porkbun, mountPath: /run/secrets/porkbun, readOnly: true}
          readinessProbe:
            tcpSocket: {port: 443}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /metrics, port: 9180}
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 256Mi
      volumes:
        - name: caddyfile
          configMap:
            name: caddyfile
        - name: data
          persistentVolumeClaim:
            claimName: caddy-data
        # brick-k8s-secrets front-door/porkbun-sealedsecret.yaml
        - name: porkbun
          secret:
            secretName: porkbun
---
# kube-vip answers ARP for 192.168.1.221 and writes it into this Service's
# status; kube-proxy routes the address by that status. k3s's ServiceLB blanked
# it when the node list changed (despite loadBalancerClass), and kube-vip only
# writes it again when it re-elects, so from 2026-10-17 23:53 to 2026-10-19
# Traefik's ServiceLB hostPort answered on the address instead, with its
# self-signed default certificate, for every *.brick name. ServiceLB is now
# disabled (README, "Front door on the cluster"), and kube-vip still empties
# the status itself between losing and regaining the lease (each Caddy
# rollout). externalIPs is in the spec, which only git (Argo CD) writes, so
# kube-proxy routes the address here whatever the status says. scripts/validate
# checks every kube-vip address is listed here too.
apiVersion: v1
kind: Service
metadata:
  name: caddy
  namespace: front-door
  annotations:
    kube-vip.io/loadbalancerIPs: 192.168.1.221
spec:
  type: LoadBalancer
  loadBalancerClass: kube-vip.io/kube-vip-class
  externalIPs: [192.168.1.221]
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: caddy
  ports:
    - {name: http, port: 80, targetPort: 80}
    - {name: https, port: 443, targetPort: 443}
    - {name: metrics, port: 9180, targetPort: 9180}
