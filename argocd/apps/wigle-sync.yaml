# Wardriving uploads (CronJob) and wigle-console. From operations-ivy/wigle-sync's k8s_config/ on main.
#
# Automated (#42): a merge to main is a deploy, a hand-made change is put
# back, and an object deleted from git is deleted here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wigle-sync
  namespace: argocd
spec:
  project: apps
  source:
    repoURL: https://github.com/operations-ivy/wigle-sync.git
    targetRevision: main
    path: k8s_config
    # Rendered with Kustomize, which Argo detects from k8s_config/kustomization.yaml.
    # No `kustomize: {}` here: the API server drops the empty object, so root
    # would see a diff it can never sync. The kustomization single-sources the
    # image tags. It lists only the manifests, so the dashboards' .json sources
    # beside the ConfigMaps are ignored without needing a directory exclude.
  destination:
    server: https://kubernetes.default.svc
    namespace: wigle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
