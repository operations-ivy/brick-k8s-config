# Generated by scripts/build-timeline from front-door/timeline/: edit those
# files and rerun it, not this one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: timeline-site
  namespace: front-door
  labels:
    app.kubernetes.io/name: timeline
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
data:
  index.html: |
    <!doctype html>
    <!-- timeline.brick.nozdormu.cloud: the brick homelab's history in TimelineJS3
         (Knight Lab, vendored: no outside requests). Two halves, merged here:
         timeline-history.yaml (the curated milestones) and feed.json (every merged
         pull request, a slide per repo per week, refreshed hourly by the
         timeline-feed job). If the feed is missing, the milestones still show. -->
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>brick timeline</title>
    <link rel="stylesheet" href="timelinejs3-3.9.13.dark.css">
    <style>
      /* The board's palette (brick-status, since the redesign) over TimelineJS3's dark theme. */
      :root {
        --void: #04050a; --panel: #0a0e19; --edge: #1a2442; --grid: #0e1630;
        --text: #c9f3ff; --dim: #5b7799; --cyan: #00eaff; --magenta: #ff2bd6;
        --mono: "IBM Plex Mono", "DejaVu Sans Mono", ui-monospace, monospace;
      }
      html, body { height: 100%; margin: 0; background: var(--void); color: var(--text); }
      body {
        background-image: linear-gradient(var(--grid) 1px, transparent 1px),
                          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 56px 56px;
      }
      #timeline { width: 100%; height: 100vh; }
      /* Only when something's wrong; the feed's time is on the title slide. */
      #status { display: none; position: fixed; left: 50%; top: 8px; transform: translateX(-50%); z-index: 50;
                font: 12px var(--mono); color: var(--magenta); background: var(--panel); border: 1px solid var(--magenta);
                padding: 2px 8px; }
      #status.bad { display: block; }

      .tl-timeline { background: transparent; color: var(--text); }
      /* The slides over the grid, not on the theme's own background. */
      .tl-storyslider, .tl-slider-container-mask, .tl-slider-container, .tl-slider-item-container,
      .tl-slide, .tl-slider-background { background: transparent !important; }
      .tl-timegroup { background-color: rgba(14, 22, 48, 0.55); }
      .tl-timegroup.tl-timegroup-alternate { background-color: rgba(10, 14, 25, 0.75); }
      .tl-timeline h2.tl-headline-title, .tl-timeline h2.tl-headline, .tl-timeline h3 { color: var(--cyan);
        text-shadow: 0.04em 0 var(--magenta), -0.04em 0 var(--cyan); letter-spacing: 0.02em; }
      .tl-timeline p, .tl-timeline li { color: var(--text); }
      .tl-timeline a { color: var(--cyan); }
      .tl-timeline code { color: var(--magenta); }
      .tl-headline-date, .tl-timeline h3.tl-headline-date { color: var(--magenta); text-shadow: none; font-family: var(--mono); }
      .tl-text ul { text-align: left; padding-left: 1.2em; font-size: 0.85em; }
      .tl-text li { margin: 0.15em 0; }
      .tl-timenav { background: rgba(10, 14, 25, 0.92); border-top: 2px solid var(--edge); }
      .tl-timenav .tl-timeaxis { background: var(--panel); }
      .tl-timenav .tl-timeaxis .tl-timeaxis-content-container .tl-timeaxis-major .tl-timeaxis-tick-text,
      .tl-timenav .tl-timeaxis .tl-timeaxis-content-container .tl-timeaxis-minor .tl-timeaxis-tick-text { color: var(--dim); }
      .tl-timemarker .tl-timemarker-content-container { background: var(--panel); border: 1px solid var(--edge); }
      .tl-timemarker .tl-timemarker-content-container .tl-timemarker-content .tl-timemarker-text h2.tl-headline { color: var(--text); text-shadow: none; }
      .tl-timemarker.tl-timemarker-active .tl-timemarker-content-container { background: var(--cyan); border-color: var(--cyan); }
      .tl-timemarker.tl-timemarker-active .tl-timemarker-content-container .tl-timemarker-content .tl-timemarker-text h2.tl-headline { color: var(--void); }
      .tl-timemarker .tl-timemarker-line-left, .tl-timemarker .tl-timemarker-line-right { border-color: var(--edge); }
      .tl-timemarker.tl-timemarker-active .tl-timemarker-line-left, .tl-timemarker.tl-timemarker-active .tl-timemarker-line-right { border-color: var(--cyan); }
      .tl-timegroup .tl-timegroup-message { color: var(--magenta); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.08em; }
      .tl-timeera .tl-timeera-background { opacity: 0.25; }
      .tl-slidenav-next .tl-slidenav-title, .tl-slidenav-previous .tl-slidenav-title { color: var(--cyan); }
      .tl-slidenav-next .tl-slidenav-description, .tl-slidenav-previous .tl-slidenav-description { color: var(--dim); }
      .tl-feed-note { font: 0.8em var(--mono); color: var(--dim) !important; }
      .tl-menubar-button { background: var(--panel); color: var(--cyan); border-color: var(--edge); }
    </style>
    </head>
    <body>
    <div id="timeline"></div>
    <div id="status"></div>
    <script src="js-yaml-5.5.0.min.js"></script>
    <script src="timelinejs3-3.9.13.js"></script>
    <script>
    "use strict";
    const ERA_COLOURS = ["#ff2bd6", "#5b7799", "#1a2442", "#00eaff", "#39ff6a"];

    // A YAML date comes back from js-yaml as a Date (UTC midnight); a string also works.
    function tlDate(d) {
      const day = d instanceof Date ? d : new Date(`${d}T00:00:00Z`);
      return { year: day.getUTCFullYear(), month: day.getUTCMonth() + 1, day: day.getUTCDate() };
    }

    function milestones(history) {
      return (history.events || []).map((e, i) => ({
        start_date: tlDate(e.date),
        group: e.group,
        unique_id: `m-${i}`,
        text: { headline: e.headline, text: e.text || "" },
      }));
    }

    function eras(history) {
      const today = new Date();
      return (history.eras || []).map((e, i) => ({
        start_date: tlDate(e.start),
        end_date: tlDate(e.end || today),
        text: { headline: e.headline },
        background: { color: ERA_COLOURS[i % ERA_COLOURS.length] },
      }));
    }

    async function load() {
      const status = document.getElementById("status");
      const history = jsyaml.load(await (await fetch("timeline-history.yaml", { cache: "no-cache" })).text());
      let feed = { events: [] };
      try {
        const reply = await fetch("feed.json", { cache: "no-cache" });
        if (!reply.ok) throw new Error(`HTTP ${reply.status}`);
        feed = await reply.json();
        const prs = Object.values(feed.pull_requests || {}).reduce((a, b) => a + b, 0);
        history.title.text += `<p class="tl-feed-note">${prs} merged pull requests, as of ${new Date(feed.generated).toLocaleString()}.</p>`;
      } catch (e) {
        status.textContent = "pull requests unavailable: milestones only";
        status.classList.add("bad");
      }
      const events = [...milestones(history), ...(feed.events || [])];
      const data = { title: { text: history.title }, eras: eras(history), events };
      // Open on the day homelab-context started (slide 0 is the title).
      const sorted = events.map(e => e.start_date).map(d => Date.UTC(d.year, d.month - 1, d.day)).sort((a, b) => a - b);
      const start = sorted.findIndex(t => t >= Date.UTC(2026, 9, 10));
      new TL.Timeline("timeline", data, {
        script_path: "./",      // nothing else to load: the font and language are built in
        font: null,
        language: "en",
        hash_bookmark: true,
        start_at_slide: start < 0 ? 0 : start + 1,
        timenav_height_percentage: 40,
        initial_zoom: 5,
        scale_factor: 1,
        marker_height_min: 24,
        optimal_tick_width: 90,
      });
    }
    load().catch(e => {
      const status = document.getElementById("status");
      status.textContent = `timeline failed to load: ${e.message}`;
      status.classList.add("bad");
    });
    </script>
    </body>
    </html>
  timeline-history.yaml: |
    # The brick homelab's history, for timeline.brick.nozdormu.cloud (TimelineJS3).
    #
    # Curated: the milestones, worked out from the git history of the operations-ivy
    # repos (before 2026-10-10) and the session notes kept since. The page adds the
    # merged pull requests of the public repos, a slide per repo per week, from
    # the hourly timeline-feed job (front-door/timeline/feed.py).
    #
    # This repo is public: features only. No addresses, credentials or anything
    # about people. Add a milestone when something ships that changes how the
    # homelab works; the PR feed covers the rest.
    #
    # date: YYYY-MM-DD. group: one of the rows below. text: HTML is allowed.
    title:
      headline: brick, from the start
      text: >-
        How a practice repo became a three-node Raspberry Pi cluster with an
        arcade cabinet, wall panels and a desk display: the milestones, and every
        merged pull request.

    groups: [Origins, Cluster, Delivery, Apps, Cabinet, Displays]

    eras:
      - {start: 2023-12-27, end: 2025-03-24, headline: Practice}
      - {start: 2025-03-25, end: 2025-05-31, headline: The first cluster}
      - {start: 2025-06-01, end: 2026-09-14, headline: Quiet}
      - {start: 2026-09-15, end: 2026-10-09, headline: The build-out}
      - {start: 2026-10-10, headline: homelab-context}  # runs to today

    events:
      # --- Practice ------------------------------------------------------------
      - date: 2023-12-27
        group: Origins
        headline: project_viper starts
        text: A catch-all practice repo for Python, SQLite and small APIs. Most of what came later started here.
      - date: 2024-02-07
        group: Origins
        headline: First steps with Kubernetes
        text: Practice Flask apps on minikube, in project_viper.
      - date: 2024-02-26
        group: Origins
        headline: The joke importer
        text: SQLite middleware and a joke importer script, with tests by March. The seed of chucks-wisdom.
      - date: 2025-02-11
        group: Origins
        headline: Kafka experiments
        text: Kafka producers and consumers in project_viper, long before Kafka ran on the cluster.
      - date: 2025-03-22
        group: Origins
        headline: A host and port printer for tiny Pi screens
        text: A terminal display for small Raspberry Pi screens, an early sign of the panels to come.

      # --- The first cluster -----------------------------------------------------
      - date: 2025-03-25
        group: Apps
        headline: chucks-wisdom breaks out
        text: The joke importer leaves project_viper for its own repo, and is containerised within days.
      - date: 2025-04-13
        group: Apps
        headline: chucks-wisdom moves to Postgres
        text: SQLite storage converted to Postgres.
      - date: 2025-05-03
        group: Cluster
        headline: brick-k8s-config starts
        text: The cluster's configuration repo. A week later app manifests move to each app's own repo, the split every app still follows.
      - date: 2025-05-12
        group: Cluster
        headline: Recovery steps written down
        text: The first cluster runbook, in brick-k8s-config's README.
      - date: 2025-05-18
        group: Cluster
        headline: First monitoring, first metrics
        text: A first kube-prometheus-stack, and the joke importer instrumented for metrics.
      - date: 2025-05-24
        group: Displays
        headline: An LCARS interface on a Raspberry Pi
        text: A fork of the open-source rpi_lcars made to run. Seventeen months later it became the bedroom wall panel.

      # --- The build-out ---------------------------------------------------------
      - date: 2026-09-16
        group: Cluster
        headline: Redeployed on Raspberry Pi 5s
        text: chucks-wisdom hardened and its manifests cleaned up for the new Pi 5 nodes.
      - date: 2026-09-19
        group: Cluster
        headline: The Kubernetes dashboard on the LAN
        text: Served through Traefik instead of an SSH tunnel.
      - date: 2026-09-20
        group: Apps
        headline: The reader's cyberpunk console
        text: chucks-wisdom's reader serves a console page backed by a live JSON API.
      - date: 2026-09-21
        group: Cluster
        headline: Prometheus and Grafana for real
        text: kube-prometheus-stack installed; dashboards register themselves from labelled ConfigMaps.
      - date: 2026-09-22
        group: Cluster
        headline: Tracing, and sealed secrets
        text: Tempo and the OpenTelemetry Collector for traces; credentials committed only as SealedSecrets.
      - date: 2026-09-24
        group: Apps
        headline: wigle-sync
        text: Hourly uploads of the wardriving Pi's Kismet logs to WiGLE, with Loki and the Pushgateway joining the monitoring the same week.
      - date: 2026-09-26
        group: Delivery
        headline: Jenkins and the status board
        text: brick-cicd-config starts with Jenkins and brick-status, the board on brick9000's screen.
      - date: 2026-09-28
        group: Delivery
        headline: Tests before every push
        text: Pull requests open with their test results.
      - date: 2026-10-02
        group: Cluster
        headline: Every web UI at its own name over HTTPS
        text: <code>&lt;app&gt;.brick.nozdormu.cloud</code> for everything, with real certificates; the <code>.local</code> names start to retire.
      - date: 2026-10-07
        group: Apps
        headline: The wardriving Pi bootstraps from git
        text: brick69 rebuilt from the wigle-sync repo alone.
      - date: 2026-10-08
        group: Delivery
        headline: Jenkins moves onto the cluster
        text: Same jobs and webhooks, now a cluster workload.

      # --- homelab-context ---------------------------------------------------------
      - date: 2026-10-10
        group: Delivery
        headline: homelab-context starts
        text: One shared, versioned record of how the homelab works, read at the start of every working session. Most of what follows is written down there.
      - date: 2026-10-10
        group: Apps
        headline: The wardrive radar; two replicas everywhere
        text: wigle-console gets its radar, and the web apps run two replicas on different nodes.
      - date: 2026-10-11
        group: Cabinet
        headline: Games on the cabinet
        text: RetroArch opens over the board when the controller turns on.
      - date: 2026-10-12
        group: Apps
        headline: overwatch
        text: A Bluetooth tracker watch becomes an app of its own.
      - date: 2026-10-13
        group: Cluster
        headline: Kubernetes by default
        text: If it can run on the cluster, it does; host-only work needs a reason. Systemd units get metrics.
      - date: 2026-10-15
        group: Displays
        headline: The LCARS panel and Home Assistant
        text: brick1982 leaves the cluster to become a touchscreen LCARS panel; Home Assistant arrives with the thermostat.
      - date: 2026-10-16
        group: Delivery
        headline: GitOps with Argo CD
        text: Every Kubernetes workload deploys from git.
      - date: 2026-10-16
        group: Cabinet
        headline: Five more consoles
        text: Sega CD, 32X, PSP, Dreamcast and Neo Geo on the cabinet.
      - date: 2026-10-17
        group: Cluster
        headline: The front door moves onto the cluster
        text: brick9000's hardware died; Caddy and kube-vip took over every name, and nothing the homelab needs depends on one host again.
      - date: 2026-10-20
        group: Cluster
        headline: kube-vip is the only load balancer
        text: k3s's ServiceLB off; hosts called by name everywhere.
      - date: 2026-10-21
        group: Displays
        headline: The panel grows
        text: Calendar, house average, forecast and alerts on the LCARS panel.
      - date: 2026-10-22
        group: Apps
        headline: brick69's status LEDs
        text: The wardriving Pi shows what it sees on its own LEDs.
      - date: 2026-10-24
        group: Delivery
        headline: brick-observe 0.1.0
        text: One library gives every service its logs, metrics and traces from a single call.
      - date: 2026-10-25
        group: Cluster
        headline: Kafka on the cluster
        text: The Strimzi operator and a KRaft cluster, as Argo CD apps.
      - date: 2026-10-26
        group: Cabinet
        headline: The cabinet is back
        text: brick9000 returns on a new Picade X HAT.
      - date: 2026-10-28
        group: Delivery
        headline: One line per release
        text: Image tags single-sourced with Kustomize.
      - date: 2026-10-31
        group: Delivery
        headline: Builds start from a push
        text: Every pushed branch builds its images; release branches build the tags they name.
      - date: 2026-10-31
        group: Apps
        headline: The wardrive atlas
        text: The radar replaced by a replay of each drive.
      - date: 2026-11-01
        group: Cluster
        headline: The tile wall, and a new log pipeline
        text: brick.nozdormu.cloud becomes a tile per service; Alloy replaces Promtail.
      - date: 2026-11-01
        group: Cabinet
        headline: The plasma API
        text: One service owns the cabinet's button lights; anything can signal through it.
      - date: 2026-11-03
        group: Cabinet
        headline: The cabinet's buttons do things
        text: Sleep and wake on the side, check everything from the front.
      - date: 2026-11-03
        group: Delivery
        headline: Jenkins builds itself
        text: The Jenkins image is built and checked by its own pipeline.
      - date: 2026-11-03
        group: Displays
        headline: The Presto
        text: A Pimoroni Presto desk display with a neon home screen and four apps.
      - date: 2026-11-04
        group: Displays
        headline: presto-photos on the cluster
        text: The Presto's photos come from a cluster service; days later it updates itself over Wi-Fi.
      - date: 2026-11-05
        group: Delivery
        headline: Maintenance windows
        text: Planned work silences what it would set off.
      - date: 2026-11-05
        group: Displays
        headline: The lamp joins Home Assistant
        text: And gets a button on the cabinet the next day.
      - date: 2026-11-07
        group: Cluster
        headline: Images shared between nodes
        text: k3s's embedded registry (Spegel) on every node; old images pruned nightly.
      - date: 2026-11-07
        group: Cabinet
        headline: A Wi-Fi watchdog
        text: brick9000 re-associates by itself when broadcasts stop arriving.
      - date: 2026-11-08
        group: Cabinet
        headline: The board's redesign
        text: Neon on near-black, VT323, a grid and a raster, TV static between screens.
      - date: 2026-11-08
        group: Delivery
        headline: Power-down, and change markers
        text: A job to take a node out of service and back; every build marked on the Grafana dashboards.
      - date: 2026-11-09
        group: Cabinet
        headline: The cabinet stops cooking itself
        text: A warning that kept the board hot fixed; the CRT's job card shows the branch; RetroArch in the board's look; button 5 enlarges the CRT.
      - date: 2026-11-09
        group: Cluster
        headline: This timeline
        text: timeline.brick.nozdormu.cloud, fed hourly by every merged pull request.
---
