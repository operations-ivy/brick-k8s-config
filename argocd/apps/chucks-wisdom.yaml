# The reader and Postgres (its PVC is on brick2000). From operations-ivy/chucks-wisdom's k8s_config/ on main.
# The importer Job is left out: Jenkins' chuck-importer job creates it and it
# deletes itself 10 minutes after finishing, so Argo would keep recreating it.
#
# Manual sync until it has shown no diff against what's live (#42); then
# automated, with prune and self-heal, in its own PR.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chucks-wisdom
  namespace: argocd
spec:
  project: apps
  source:
    repoURL: https://github.com/operations-ivy/chucks-wisdom.git
    targetRevision: main
    path: k8s_config
    directory:
      recurse: true
      # The Grafana dashboards' .json sources sit beside their ConfigMaps.
      exclude: '{*.json,**/*.json,importer/importer-job.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: chuck
