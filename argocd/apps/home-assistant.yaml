# Home Assistant (its config PVC is on brick2000). From operations-ivy/home-assistant's k8s_config/ on main.
#
# Automated (#42): a merge to main is a deploy, a hand-made change is put
# back, and an object deleted from git is deleted here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-assistant
  namespace: argocd
spec:
  project: apps
  source:
    repoURL: https://github.com/operations-ivy/home-assistant.git
    targetRevision: main
    path: k8s_config
    # Rendered with Kustomize, which Argo detects from k8s_config/kustomization.yaml:
    # it generates HA's config ConfigMap with a content hash in its name, so a
    # config change rolls HA. No `kustomize: {}` here (the API server drops the
    # empty object and root would diff forever), and no `directory:` (that would
    # apply the kustomization and ha/*.yaml as manifests).
  destination:
    server: https://kubernetes.default.svc
    namespace: home-assistant
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
