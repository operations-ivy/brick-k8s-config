# Every SealedSecret in operations-ivy/brick-k8s-secrets (private: read over
# SSH with a read-only deploy key, the repo-brick-k8s-secrets SealedSecret,
# which is applied by hand once at bootstrap and then managed here too).
#
# Automated (#42), but without prune: deleting a SealedSecret deletes its
# Secret, and losing argocd-secret or the repo key would lock Argo out of its
# own repair. Remove a secret on purpose, by hand.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: git@github.com:operations-ivy/brick-k8s-secrets.git
    targetRevision: main
    path: .
    directory:
      recurse: true
      include: '**/*-sealedsecret.yaml'
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
