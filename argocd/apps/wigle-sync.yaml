# Wardriving uploads (CronJob) and wigle-console. From operations-ivy/wigle-sync's k8s_config/ on main.
#
# Automated (#42): a merge to main is a deploy, a hand-made change is put
# back, and an object deleted from git is deleted here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wigle-sync
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/operations-ivy/wigle-sync.git
    targetRevision: main
    path: k8s_config
    directory:
      recurse: true
      # The Grafana dashboards' .json sources sit beside their ConfigMaps.
      exclude: '{*.json,**/*.json}'
  destination:
    server: https://kubernetes.default.svc
    namespace: wigle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
