<!doctype html>
<!-- timeline.brick.nozdormu.cloud: the brick homelab's story in TimelineJS3
     (Knight Lab, vendored: no outside requests). timeline-history.yaml holds
     it: chapters, each opened by a slide of its own, and milestones that link
     what led to them and what they led to. feed.json (every merged pull
     request, a slide per repo per week, refreshed hourly by the timeline-feed
     job) counts the pull requests in each chapter, and with ?prs=1 shows them
     all as slides. If the feed is missing, the story still shows. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brick timeline</title>
<link rel="stylesheet" href="timelinejs3-3.9.13.dark.css">
<style>
  /* The board's palette (brick-status, since the redesign) over TimelineJS3's dark theme. */
  :root {
    --void: #04050a; --panel: #0a0e19; --edge: #1a2442; --grid: #0e1630;
    --text: #c9f3ff; --dim: #5b7799; --cyan: #00eaff; --magenta: #ff2bd6;
    --mono: "IBM Plex Mono", "DejaVu Sans Mono", ui-monospace, monospace;
  }
  html, body { height: 100%; margin: 0; background: var(--void); color: var(--text); }
  body {
    background-image: linear-gradient(var(--grid) 1px, transparent 1px),
                      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 56px 56px;
  }
  #timeline { width: 100%; height: 100vh; }
  /* Only when something's wrong; the feed's time is on the title slide. */
  #status { display: none; position: fixed; left: 50%; top: 8px; transform: translateX(-50%); z-index: 50;
            font: 12px var(--mono); color: var(--magenta); background: var(--panel); border: 1px solid var(--magenta);
            padding: 2px 8px; }
  #status.bad { display: block; }

  .tl-timeline { background: transparent; color: var(--text); }
  /* The slides over the grid, not on the theme's own background. */
  .tl-storyslider, .tl-slider-container-mask, .tl-slider-container, .tl-slider-item-container,
  .tl-slide, .tl-slider-background { background: transparent !important; }
  .tl-timegroup { background-color: rgba(14, 22, 48, 0.55); }
  .tl-timegroup.tl-timegroup-alternate { background-color: rgba(10, 14, 25, 0.75); }
  .tl-timeline h2.tl-headline-title, .tl-timeline h2.tl-headline, .tl-timeline h3 { color: var(--cyan);
    text-shadow: 0.04em 0 var(--magenta), -0.04em 0 var(--cyan); letter-spacing: 0.02em; }
  .tl-timeline p, .tl-timeline li { color: var(--text); }
  .tl-timeline a { color: var(--cyan); }
  .tl-timeline code { color: var(--magenta); }
  .tl-headline-date, .tl-timeline h3.tl-headline-date { color: var(--magenta); text-shadow: none; font-family: var(--mono); }
  .tl-text ul { text-align: left; padding-left: 1.2em; font-size: 0.85em; }
  .tl-text li { margin: 0.15em 0; }
  .tl-timenav { background: rgba(10, 14, 25, 0.92); border-top: 2px solid var(--edge); }
  .tl-timenav .tl-timeaxis { background: var(--panel); }
  .tl-timenav .tl-timeaxis .tl-timeaxis-content-container .tl-timeaxis-major .tl-timeaxis-tick-text,
  .tl-timenav .tl-timeaxis .tl-timeaxis-content-container .tl-timeaxis-minor .tl-timeaxis-tick-text { color: var(--dim); }
  .tl-timemarker .tl-timemarker-content-container { background: var(--panel); border: 1px solid var(--edge); }
  .tl-timemarker .tl-timemarker-content-container .tl-timemarker-content .tl-timemarker-text h2.tl-headline { color: var(--text); text-shadow: none; }
  .tl-timemarker.tl-timemarker-active .tl-timemarker-content-container { background: var(--cyan); border-color: var(--cyan); }
  .tl-timemarker.tl-timemarker-active .tl-timemarker-content-container .tl-timemarker-content .tl-timemarker-text h2.tl-headline { color: var(--void); }
  .tl-timemarker .tl-timemarker-line-left, .tl-timemarker .tl-timemarker-line-right { border-color: var(--edge); }
  .tl-timemarker.tl-timemarker-active .tl-timemarker-line-left, .tl-timemarker.tl-timemarker-active .tl-timemarker-line-right { border-color: var(--cyan); }
  .tl-timegroup .tl-timegroup-message { color: var(--magenta); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.08em; }
  .tl-timeera .tl-timeera-background { opacity: 0.25; }
  .tl-slidenav-next .tl-slidenav-title, .tl-slidenav-previous .tl-slidenav-title { color: var(--cyan); }
  .tl-slidenav-next .tl-slidenav-description, .tl-slidenav-previous .tl-slidenav-description { color: var(--dim); }
  /* Pizazz: the board's TV static between slides, a glitch as each headline
     tunes in, glowing art. All of it stops for prefers-reduced-motion. */
  #static { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 40; pointer-events: none;
            display: none; image-rendering: pixelated; opacity: 0.85; }
  .tl-slide.tuned h2.tl-headline, .tl-slide.tuned h2.tl-headline-title { animation: tune-in 0.6s steps(1) 1; }
  @keyframes tune-in {
    0% { transform: translateX(0.12em) skewX(-12deg); opacity: 0.3; }
    20% { transform: translateX(-0.08em); opacity: 1; }
    40% { transform: translateX(0.04em) skewX(6deg); }
    60%, 100% { transform: none; }
  }
  .tl-slide .tl-media img { border-radius: 10px; box-shadow: 0 0 24px rgba(0, 234, 255, 0.25), 0 0 2px #00eaff; }
  .tl-slide-titleslide .tl-media img { box-shadow: 0 0 40px rgba(255, 43, 214, 0.45), 0 0 2px #ff2bd6; }
  .tl-slide-titleslide h2.tl-headline-title { font-size: 3em; animation: glitch 3s steps(1) infinite; }
  @keyframes glitch { 0%, 90% { transform: none; } 92% { transform: translateX(0.06em) skewX(-8deg); }
                      94% { transform: translateX(-0.05em); } 96% { transform: skewX(5deg); } }
  .tl-timeera .tl-timeera-background { opacity: 0.4; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .tl-feed-note { font: 0.8em var(--mono); color: var(--dim) !important; }
  .tl-menubar-button { background: var(--panel); color: var(--cyan); border-color: var(--edge); }
  /* The story: chapter cards, and the threads between milestones. */
  .tl-chapter-story { font-size: 1.25em; line-height: 1.5; }
  .tl-chapter-stats { font: 0.85em var(--mono); color: var(--magenta) !important; letter-spacing: 0.04em; }
  .tl-chapter-span { font: 0.8em var(--mono); color: var(--dim) !important; }
  .tl-thread { margin-top: 1.2em; padding-top: 0.6em; border-top: 1px solid var(--edge);
               font: 0.8em/1.7 var(--mono); color: var(--dim) !important; }
  .tl-thread b { color: var(--text); font-weight: normal; text-transform: uppercase; letter-spacing: 0.06em; }
  .tl-thread a { text-decoration: none; border-bottom: 1px dotted currentColor; }
  #prs { position: fixed; right: 10px; top: 8px; z-index: 50; font: 12px var(--mono); color: var(--dim);
         background: var(--panel); border: 1px solid var(--edge); padding: 3px 10px; cursor: pointer; }
  #prs:hover, #prs.on { color: var(--cyan); border-color: var(--cyan); }
</style>
</head>
<body>
<div id="timeline"></div>
<div id="status"></div>
<button id="prs" type="button"></button>
<canvas id="static"></canvas>
<script src="js-yaml-5.5.0.min.js"></script>
<script src="timelinejs3-3.9.13.js"></script>
<script>
"use strict";
const PR_COLOUR = "#5b7799";
const CHAPTERS = "Chapters";  // the row the chapter cards sit in
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const showPrs = new URLSearchParams(location.search).get("prs") === "1";

// A YAML date comes back from js-yaml as a Date (UTC midnight); a string also works.
function tlDate(d) {
  const day = d instanceof Date ? d : new Date(`${d}T00:00:00Z`);
  return { year: day.getUTCFullYear(), month: day.getUTCMonth() + 1, day: day.getUTCDate() };
}

const utc = d => { const t = tlDate(d); return Date.UTC(t.year, t.month - 1, t.day); };
const fmtDay = d => new Date(utc(d)).toLocaleDateString("en", { timeZone: "UTC", month: "short", day: "numeric", year: "numeric" });
const link = (e, prefix = "") => `${prefix}<a href="#event-${e.uid}">${esc(e.headline)}</a>`;

// The threads under a milestone: what led to it (its "after"), what it led to
// (every milestone naming it), and the next milestone in its row.
function thread(e, byId, all) {
  const lines = [];
  const cause = byId[e.after];
  if (cause) lines.push(`<b>Because of</b> ← ${link(cause)}`);
  const effects = all.filter(o => o.after && o.after === e.id);
  if (effects.length) lines.push(`<b>Led to</b> → ${effects.map(o => link(o)).join(" · ")}`);
  const next = all.find(o => o.group === e.group && o.i > e.i);
  if (next && !effects.includes(next)) lines.push(`<b>Next in ${esc(e.group)}</b> → ${link(next)}`);
  return lines.length ? `<p class="tl-thread">${lines.join("<br>")}</p>` : "";
}

// Each milestone gets its row's picture (or its own), an id that names its row
// (the track's markers are coloured by it: rowStyles) and its threads.
function milestones(history) {
  const rows = history.rows || {};
  const all = (history.events || []).map((e, i) => ({ ...e, i, uid: `m-${slug(e.group)}-${i}` }))
    .sort((a, b) => utc(a.date) - utc(b.date) || a.i - b.i);
  const byId = Object.fromEntries(all.filter(e => e.id).map(e => [e.id, e]));
  return all.map(e => ({
    start_date: tlDate(e.date),
    group: e.group,
    unique_id: e.uid,
    text: { headline: e.headline, text: `<p>${e.text || ""}</p>${thread(e, byId, all)}` },
    media: { url: `art-${e.art || rows[e.group]?.art || "origins"}.svg`, alt: e.headline },
  }));
}

// A pull-request week's merges: one list item each (feed.py).
const merges = e => ((e.text?.text || "").match(/<li>/g) || []).length;

// A card opening each chapter: its story, its span, and what happened in it.
function chapterCards(history, pulls) {
  const chapters = history.chapters || [];
  const today = new Date();
  return chapters.map((c, n) => {
    const from = utc(c.start), to = c.end ? utc(c.end) : today.getTime();
    const inside = d => { const t = utc(d); return t >= from && t <= to; };
    const count = (history.events || []).filter(e => inside(e.date)).length;
    const prs = pulls.filter(p => inside(new Date(Date.UTC(p.start_date.year, p.start_date.month - 1, p.start_date.day))))
      .reduce((sum, p) => sum + merges(p), 0);
    const span = `${fmtDay(c.start)} – ${c.end ? fmtDay(c.end) : "today"}`;
    const stats = [`${count} milestone${count === 1 ? "" : "s"}`];
    if (pulls.length) stats.push(`${prs} pull request${prs === 1 ? "" : "s"} merged`);
    return {
      start_date: tlDate(c.start),
      display_date: `Chapter ${n + 1} of ${chapters.length}`,
      group: CHAPTERS,
      unique_id: `c${n + 1}-${slug(c.headline)}`,
      text: { headline: c.headline,
              text: `<p class="tl-chapter-span">${span}</p><p class="tl-chapter-story">${c.story || ""}</p>`
                    + `<p class="tl-chapter-stats">${stats.join(" · ")}</p>` },
      media: { url: `art-${c.art || "title"}.svg`, alt: c.headline },
    };
  });
}

// The last slide, today: the story so far, in numbers.
function epilogue(history, feed) {
  const milestones = (history.events || []).length;
  const prs = Object.values(feed.pull_requests || {}).reduce((a, b) => a + b, 0);
  const now = new Date();
  const facts = [`${milestones} milestones in ${(history.chapters || []).length} chapters`];
  if (prs) facts.push(`${prs} merged pull requests across ${Object.keys(feed.pull_requests).length} public repos`);
  return {
    start_date: { year: now.getFullYear(), month: now.getMonth() + 1, day: now.getDate() },
    display_date: "Today",
    group: CHAPTERS,
    unique_id: "c-to-be-continued",
    text: { headline: "To be continued",
            text: `<p class="tl-chapter-story">${facts.join("; ")}. The next milestone is whatever ships next;
                   every merged pull request lands here within the hour.</p>
                   <p class="tl-thread"><b>Start again</b> → <a href="#event-c1-${slug(history.chapters?.[0]?.headline || "")}">Chapter 1</a></p>` },
    media: { url: "art-title.svg", alt: "To be continued" },
  };
}

function rowStyles(history) {
  const rule = (prefix, c) => `
    [id^="${prefix}"] .tl-timemarker-content-container { border-left: 4px solid ${c}; }
    [id^="${prefix}"].tl-timemarker-active .tl-timemarker-content-container { background: ${c}; border-color: ${c}; box-shadow: 0 0 14px ${c}; }
    [id^="${prefix}"] .tl-timemarker-line-left, [id^="${prefix}"] .tl-timemarker-line-right { border-color: ${c}; }`;
  const css = Object.entries(history.rows || {}).map(([group, row]) => rule(`m-${slug(group)}-`, row.colour)).join("")
    + (history.chapters || []).map((c, n) => rule(`c${n + 1}-`, c.colour)).join("")
    + rule("c-to-be-continued", "#ffffff") + rule("pr-", PR_COLOUR);
  document.head.insertAdjacentHTML("beforeend", `<style>${css}</style>`);
}

// The rows' names in their colours, once TimelineJS has drawn them.
function colourRowNames(history) {
  for (const el of document.querySelectorAll(".tl-timegroup-message")) {
    const row = (history.rows || {})[el.textContent.trim()];
    if (row) el.style.color = row.colour;
  }
}

// The board's static (brick-status, static/index.html): six frames from all noise
// to a last few bars, 55 ms each.
const STATIC_FRAMES = [1.0, 0.8, 0.55, 0.35, 0.18, 0.07];
const STATIC_COLOURS = ["#00eaff", "#1a2442", "#0a0e19", "#ff2bd6", "#5b7799"];
function drawStatic(canvas, cover) {
  const w = canvas.width = Math.max(1, Math.round(canvas.clientWidth / 4));
  const h = canvas.height = Math.max(1, Math.round(canvas.clientHeight / 4));
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, w, h);
  if (cover >= 1) { ctx.fillStyle = "rgba(4,5,10,0.6)"; ctx.fillRect(0, 0, w, h); }
  const k = w / 240;
  for (let i = 0; i < Math.round(160 * cover * k); i++) {
    ctx.fillStyle = STATIC_COLOURS[Math.floor(Math.random() * STATIC_COLOURS.length)];
    ctx.fillRect(Math.round((Math.random() * 250 - 30) * k), Math.floor(Math.random() * h),
                 Math.round((15 + Math.random() * 125) * k), 1 + Math.floor(Math.random() * 2));
  }
}
let tuning = false;
function tuneIn() {
  if (tuning || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const canvas = document.getElementById("static");
  tuning = true;
  canvas.style.display = "block";
  let frame = 0;
  const step = () => {
    if (frame < STATIC_FRAMES.length) { drawStatic(canvas, STATIC_FRAMES[frame++]); setTimeout(step, 55); }
    else { canvas.style.display = "none"; tuning = false; }
  };
  step();
}
function glitchHeadline() {
  for (const el of document.querySelectorAll(".tl-slide.tuned")) el.classList.remove("tuned");
  // TimelineJS marks no slide active: the one on screen is the one nearest the left edge.
  const active = [...document.querySelectorAll(".tl-slide")]
    .map(el => [el, Math.abs(el.getBoundingClientRect().left)]).sort((a, b) => a[1] - b[1])[0]?.[0];
  if (active) { void active.offsetWidth; active.classList.add("tuned"); }
}

// The chapters again, as coloured bands along the track.
function eras(history) {
  const today = new Date();
  return (history.chapters || []).map(c => ({
    start_date: tlDate(c.start),
    end_date: tlDate(c.end || today),
    text: { headline: c.headline },
    background: { color: c.colour },
  }));
}

async function load() {
  const status = document.getElementById("status");
  const history = jsyaml.load(await (await fetch("timeline-history.yaml", { cache: "no-cache" })).text());
  let feed = { events: [] };
  try {
    const reply = await fetch("feed.json", { cache: "no-cache" });
    if (!reply.ok) throw new Error(`HTTP ${reply.status}`);
    feed = await reply.json();
    history.title.text += `<p class="tl-feed-note">Pull requests as of ${new Date(feed.generated).toLocaleString()}.</p>`;
  } catch (e) {
    status.textContent = "pull requests unavailable: the story only";
    status.classList.add("bad");
  }
  history.title.text = `<p class="tl-chapter-story">${history.title.text}</p>`
    + `<p class="tl-thread"><b>Begin</b> → press the arrow, or pick any moment on the track below.</p>`;
  const pulls = (feed.events || []).map(e => ({ media: { url: "art-pulls.svg", alt: "merged pull requests" }, ...e }));
  const events = [...chapterCards(history, pulls), ...milestones(history), epilogue(history, feed),
                  ...(showPrs ? pulls : [])];
  const data = { title: { text: history.title, media: { url: "art-title.svg", alt: "BRICK//NET" } },
                 eras: eras(history), events };
  rowStyles(history);
  const toggle = document.getElementById("prs");
  toggle.textContent = showPrs ? "every pull request: on" : "every pull request: off";
  toggle.classList.toggle("on", showPrs);
  toggle.onclick = () => { location.search = showPrs ? "" : "?prs=1"; };
  // A story starts at the beginning: the title slide, unless the link names a slide.
  const timeline = new TL.Timeline("timeline", data, {
    script_path: "./",      // nothing else to load: the font and language are built in
    font: null,
    language: "en",
    hash_bookmark: true,
    start_at_slide: 0,
    timenav_height_percentage: 40,
    initial_zoom: 5,
    scale_factor: 1,
    marker_height_min: 24,
    optimal_tick_width: 90,
  });
  timeline.on("loaded", () => setTimeout(() => colourRowNames(history), 0));
  timeline.on("change", () => { tuneIn(); setTimeout(glitchHeadline, 120); });
  setTimeout(() => colourRowNames(history), 1500);
}
load().catch(e => {
  const status = document.getElementById("status");
  status.textContent = `timeline failed to load: ${e.message}`;
  status.classList.add("bad");
});
</script>
</body>
</html>
