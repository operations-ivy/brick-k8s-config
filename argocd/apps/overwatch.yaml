# Bluetooth, Wi-Fi and UPnP watch. From operations-ivy/overwatch's k8s_config/ on main.
#
# Automated (#42): a merge to main is a deploy, a hand-made change is put
# back, and an object deleted from git is deleted here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: overwatch
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/operations-ivy/overwatch.git
    targetRevision: main
    path: k8s_config
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: overwatch
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
