# Overrides for the Traefik that k3s installs itself (a HelmChart in
# kube-system); k3s's Helm controller merges these values in and upgrades it.
# Two replicas on different nodes, so every web UI keeps answering while one
# pod moves, restarts or rolls out, and a disruption budget so a node drain
# never takes both.
#   kubectl apply -f traefik/traefik-helmchartconfig.yaml
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      replicas: 2
    # Only reached inside the cluster: the front door's Caddy forwards every
    # name to this Service (front-door/caddy.yaml). k3s's ServiceLB used to
    # publish it on every node's ports 80 and 443; ServiceLB is disabled
    # because it fought kube-vip over the front door's address (README,
    # "Front door on the cluster"). The chart takes the type under
    # service.spec; a plain service.type is silently ignored.
    service:
      spec:
        type: ClusterIP
    # Every Ingress's status names the address it's reached at: the front
    # door's. k3s turns on publishedService, which copies this Service's
    # load-balancer address, and a ClusterIP has none, so Argo CD showed
    # every app with an Ingress as Progressing.
    providers:
      kubernetesIngress:
        publishedService:
          enabled: false
        ingressEndpoint:
          ip: 192.168.1.221
    # Requests, durations and bytes per entrypoint, router and backend
    # service, for Prometheus (a metrics Service and a ServiceMonitor).
    metrics:
      prometheus:
        addRoutersLabels: true
        service:
          enabled: true
        serviceMonitor:
          enabled: true
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    # k3s's chart tolerates the control-plane taint; keep Traefik on the
    # workers, like everything else (brick420 is SD-card and Wi-Fi only).
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    # Soft: with only one schedulable node left, both still run.
    topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik-kube-system
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
