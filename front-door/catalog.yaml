# brick.nozdormu.cloud: a wall of tiles, one per *.brick service. One file with
# no build and no outside requests, so it works when the internet doesn't. Caddy
# serves it from this ConfigMap, and picks up a change without a restart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog
  namespace: front-door
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>brick</title>
    <style>
      :root {
        --mortar: #a9afac;
        --ink: #1b2326;
        --ink-soft: #3a4549;
        --sheet: #f3f5f3;
        --sheet-ink: #1b2326;
        --sheet-soft: #4a5559;
        --type: "Avenir Next", Avenir, "Segoe UI Variable Display", "Segoe UI", "Helvetica Neue", Roboto, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --mortar: #30363a;
          --ink: #eef1ef;
          --ink-soft: #b4bdbb;
          --sheet: #1d2226;
          --sheet-ink: #eef1ef;
          --sheet-soft: #b4bdbb;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: clamp(20px, 4vw, 48px) clamp(16px, 4vw, 48px) 48px;
        background: var(--mortar);
        color: var(--ink);
        font-family: var(--type);
        line-height: 1.45;
      }
      main { max-width: 1240px; margin: 0 auto; }
      h1 {
        margin: 0;
        font-size: clamp(2.6rem, 7vw, 4.4rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      header p { margin: 6px 0 clamp(20px, 3vw, 32px); color: var(--ink-soft); font-size: 1.05rem; }

      /* Running bond: a brick spans two columns and one column is spare, so every
         other course can start half a brick in and keep the same count. */
      .wall { display: grid; grid-template-columns: repeat(9, 1fr); gap: 9px; }
      .brick {
        grid-column: span 2;
        display: block;
        width: 100%;
        margin: 0;
        padding: 7px 7px 0;
        border: 0;
        border-radius: 4px;
        background: var(--glaze);
        color: var(--on);
        font: inherit;
        text-align: left;
        cursor: pointer;
        box-shadow: inset 0 2px 0 rgb(255 255 255 / .3), inset 0 -3px 0 rgb(0 0 0 / .22);
      }
      .brick:nth-child(8n + 5) { grid-column: 2 / span 2; }
      .brick:hover { filter: brightness(1.08); }
      .brick:active { transform: translateY(1px); }
      .brick:focus-visible, .go:focus-visible, .close:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
      .face { display: block; width: 100%; height: auto; border-radius: 2px; }
      .stamp { display: block; padding: 6px 3px 10px; font-size: clamp(.95rem, 1.5vw, 1.1rem); font-weight: 700; }

      @media (max-width: 900px) {
        .wall { grid-template-columns: repeat(7, 1fr); }
        .brick:nth-child(n) { grid-column: span 2; }
        .brick:nth-child(6n + 4) { grid-column: 2 / span 2; }
      }
      @media (max-width: 560px) {
        .wall { grid-template-columns: repeat(5, 1fr); gap: 7px; }
        .brick:nth-child(n) { grid-column: span 2; }
        .brick:nth-child(4n + 3) { grid-column: 2 / span 2; }
      }

      dialog {
        width: min(620px, calc(100vw - 32px));
        max-height: calc(100dvh - 32px);
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: var(--sheet);
        color: var(--sheet-ink);
        box-shadow: 0 18px 60px rgb(0 0 0 / .5);
      }
      dialog[open] { animation: settle .16s ease-out; }
      @keyframes settle { from { opacity: 0; transform: scale(.96); } }
      @media (prefers-reduced-motion: reduce) { dialog[open] { animation: none; } }
      dialog::backdrop { background: rgb(15 20 22 / .6); }
      .plate { padding: 10px 10px 13px; background: var(--glaze); box-shadow: inset 0 2px 0 rgb(255 255 255 / .3), inset 0 -3px 0 rgb(0 0 0 / .22); }
      .body { padding: 18px 22px 22px; }
      h2 { margin: 0 0 8px; font-size: 1.7rem; font-weight: 800; letter-spacing: -0.02em; }
      ul { margin: 0 0 18px; padding-left: 1.15em; color: var(--sheet-soft); }
      li { margin-bottom: 5px; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; }
      .go {
        padding: 9px 16px;
        border-radius: 4px;
        background: var(--glaze);
        color: var(--on);
        font-weight: 700;
        text-decoration: none;
        overflow-wrap: anywhere;
      }
      .close {
        padding: 9px 14px;
        border: 1px solid var(--sheet-soft);
        border-radius: 4px;
        background: none;
        color: var(--sheet-ink);
        font: inherit;
        cursor: pointer;
      }
    </style>
    </head>
