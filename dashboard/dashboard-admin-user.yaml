# Login identity for the dashboard. cluster-admin is what upstream's own
# "Creating a sample user" guide uses to get a working login token — broad on
# purpose for a home-lab single-user cluster. Scope this down (a Role bound to
# just the `chuck` namespace, say) if this cluster ever has more than one user.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-user
  namespace: kubernetes-dashboard

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-user
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: admin-user
    namespace: kubernetes-dashboard
