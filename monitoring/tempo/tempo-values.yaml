tempo:
  retention: 96h
  # The chart reads resources from `tempo.resources`; a top-level `resources`
  # is silently ignored, which left tempo-0 unbounded until 2026-09-24.
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      # ~216Mi before any wigle-sync traces; headroom for more instrumented apps.
      memory: 1Gi
      cpu: 500m

persistence:
  enabled: true
  size: 10Gi

nodeSelector:
  chuck.io/storage-node: "true"

