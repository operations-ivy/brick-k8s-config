# Alloy took over from Promtail (end of life 2026-03-02, #55): every node sends its
# pods' logs to Loki under Promtail's labels, so dashboards and LogQL queries
# kept working. The relabel rules are the Promtail chart's.
# Every line then gets one shape (loki.process "levels", #74).
alloy:
  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_controller_name"]
          regex         = "([0-9a-z-.]+?)(-[0-9a-f]{8,10})?"
          target_label  = "__tmp_controller_name"
        }
        rule {
          source_labels = [
            "__meta_kubernetes_pod_label_app_kubernetes_io_name",
            "__meta_kubernetes_pod_label_app",
            "__tmp_controller_name",
            "__meta_kubernetes_pod_name",
          ]
          regex        = "^;*([^;]+)(;.*)?$"
          target_label = "app"
        }
        rule {
          source_labels = [
            "__meta_kubernetes_pod_label_app_kubernetes_io_instance",
            "__meta_kubernetes_pod_label_instance",
          ]
          regex        = "^;*([^;]+)(;.*)?$"
          target_label = "instance"
        }
        rule {
          source_labels = [
            "__meta_kubernetes_pod_label_app_kubernetes_io_component",
            "__meta_kubernetes_pod_label_component",
          ]
          regex        = "^;*([^;]+)(;.*)?$"
          target_label = "component"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node_name"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["namespace", "app"]
          separator     = "/"
          target_label  = "job"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          replacement   = "/var/log/pods/*$1/*.log"
          target_label  = "__path__"
        }
        rule {
          source_labels = [
            "__meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash",
            "__meta_kubernetes_pod_annotation_kubernetes_io_config_hash",
            "__meta_kubernetes_pod_container_name",
          ]
          separator    = "/"
          regex        = "true/(.*)"
          replacement  = "/var/log/pods/*$1/*.log"
          target_label = "__path__"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets       = local.file_match.pods.targets
        forward_to    = [loki.process.pods.receiver]
        tail_from_end = true
      }

      loki.process "pods" {
        stage.cri {}
        forward_to = [loki.process.levels.receiver]
      }

      // Each node's journal, as `host` and `unit`. pironman5 logs every sensor
      // write in debug mode (9 MB an hour, more than everything else together).
      loki.relabel "journal" {
        forward_to = []
        rule {
          source_labels = ["__journal__systemd_unit"]
          regex         = "pironman5\\.service"
          action        = "drop"
        }
        rule {
          source_labels = ["__journal__systemd_unit"]
          target_label  = "unit"
        }
        rule {
          source_labels = ["__journal__hostname"]
          target_label  = "host"
        }
        rule {
          source_labels = ["__journal_priority_keyword"]
          target_label  = "level"
        }
      }

      loki.source.journal "host" {
        path          = "/var/log/journal"
        max_age       = "12h"
        labels        = {job = "journal"}
        relabel_rules = loki.relabel.journal.rules
        forward_to    = [loki.process.levels.receiver]
      }

      // One shape for every source (#74). A `level` label, lowercase, from
      // whichever of Loki's formats the line is in; `logger` and `trace_id` as
      // structured metadata, so they stay out of the stream labels.
      loki.process "levels" {
        // Traefik and Home Assistant colour their logs.
        stage.replace {
          expression = "(\\x1b\\[[0-9;]*[A-Za-z])"
        }

        // Home Assistant splits a traceback across entries; each of its lines
        // that starts an entry starts with a date.
        stage.match {
          selector = "{namespace=\"home-assistant\"}"
          stage.multiline {
            firstline     = "^\\d{4}-\\d{2}-\\d{2} "
            max_wait_time = "3s"
            max_lines     = 200
          }
        }

        // JSON: our services, Caddy.
        stage.match {
          selector = "{job=~\".+\"} |~ \"^\\\\s*\\\\{\""
          stage.json {
            expressions = {level = "level", logger = "logger", trace_id = "trace_id", timestamp = "timestamp", ts = "ts"}
          }
          stage.timestamp {
            source            = "timestamp"
            format            = "RFC3339Nano"
            action_on_failure = "skip"
          }
          stage.timestamp {
            source            = "ts"
            format            = "Unix"
            action_on_failure = "skip"
          }
        }

        // logfmt: Argo CD, the Grafana stack, sealed-secrets.
        stage.match {
          selector = "{job=~\".+\"} !~ \"^\\\\s*\\\\{\" |~ \"(^| )level=\""
          stage.logfmt {
            mapping = {level = "", logger = "", trace_id = "traceID"}
          }
        }

        // klog: Kubernetes' own components. I1024 02:58:43.315562
        stage.match {
          selector = "{job=~\".+\"} |~ \"^[IWEF]\\\\d{4} \""
          stage.regex {
            expression = "^(?P<level>[IWEF])\\d{4} "
          }
        }

        // The OpenTelemetry collector: timestamp<TAB>info<TAB>...
        stage.match {
          selector = "{job=~\".+\"} |~ \"^\\\\S+\\\\t(debug|info|warn|error)\\\\t\""
          stage.regex {
            expression = "^\\S+\\t(?P<level>\\w+)\\t"
          }
        }

        // Everything else names its level in capitals near the start: Postgres,
        // Jenkins, Home Assistant, Kafka, CoreDNS, Traefik.
        stage.match {
          selector = "{job=~\".+\"} !~ \"^\\\\s*\\\\{\" !~ \"(^| )level=\" !~ \"^[IWEF]\\\\d{4} \""
          stage.regex {
            expression = "^.{0,60}?\\b(?P<level>TRACE|DEBUG|DBG|INFO|INF|LOG|NOTICE|WARNING|WARN|WRN|ERROR|ERR|CRITICAL|FATAL|FTL|PANIC|PNC)\\b"
          }
        }

        // Anything not listed gets no label, so a stray value can't add streams.
        stage.template {
          source   = "level"
          // The chart runs this file through Helm first, hence the escaped braces.
          template = `{{ "{{" }} $l := ToLower .Value {{ "}}" }}{{ "{{" }} if has $l (list "trace" "debug" "dbg") {{ "}}" }}debug{{ "{{" }} else if has $l (list "i" "info" "inf" "log" "notice") {{ "}}" }}info{{ "{{" }} else if has $l (list "w" "warn" "warning" "wrn") {{ "}}" }}warning{{ "{{" }} else if has $l (list "e" "f" "err" "error" "crit" "critical" "alert" "emerg" "fatal" "ftl" "panic" "pnc") {{ "}}" }}error{{ "{{" }} end {{ "}}" }}`
        }
        stage.labels {
          values = {level = ""}
        }
        stage.structured_metadata {
          values = {logger = "", trace_id = ""}
        }

        forward_to = [loki.write.loki.receiver]
      }

      loki.write "loki" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

  # Read positions survive a restart, as Promtail's did in /run/promtail.
  storagePath: /run/alloy
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  mounts:
    varlog: true
    extra:
      - name: run
        mountPath: /run/alloy
      - name: machine-id
        mountPath: /etc/machine-id
        readOnly: true
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m

controller:
  type: daemonset
  # Every node has logs, the tainted control plane too.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  volumes:
    extra:
      - name: run
        hostPath:
          path: /run/alloy
      - name: machine-id
        hostPath:
          path: /etc/machine-id

# Alloy's own metrics: lines read and sent, send errors.
serviceMonitor:
  enabled: true
