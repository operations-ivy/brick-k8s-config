# kube-vip: holds 192.168.1.221, the front door's address, on one worker at a
# time and moves it if that worker goes away (leader election on a Lease,
# then gratuitous ARP on wlan0). 192.168.1.221 was brick9000's: the router's
# DNS host table and the public *.brick record both point every
# *.brick.nozdormu.cloud name at it, so taking the address over moved the
# front door without touching either (2026-10-17, brick9000's hardware died).
#
# Only Services of class kube-vip.io/kube-vip-class (lb_class_only). k3s's
# ServiceLB is disabled (`disable: [servicelb]` on brick420): it blanked the
# front door's status and took its address over (front-door/caddy.yaml).
#
# 192.168.1.221 is a service address now, never a host's again: brick9000
# comes back on an address of its own, and everything reaches hosts by name
# (the router's DNS follows their DHCP leases). A host answering ARP for it
# too would be an outage; the FrontDoorDown alert catches that.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-vip
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-vip
rules:
  - apiGroups: [""]
    resources: ["services/status"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["list", "get", "watch", "update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "get", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list", "get", "watch", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["list", "get", "watch", "update", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-vip
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-vip
subjects:
  - kind: ServiceAccount
    name: kube-vip
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-vip
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-vip
    spec:
      serviceAccountName: kube-vip
      hostNetwork: true
      # Workers only: the address carries every *.brick request, and brick420's
      # SD card and Wi-Fi carry the API server (cluster.md, Placement).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: kube-vip
          image: ghcr.io/kube-vip/kube-vip:v1.2.4
          args: ["manager"]
          env:
            - name: vip_arp
              value: "true"
            - name: vip_interface
              value: wlan0
            - name: port
              value: "6443"
            - name: cp_enable
              value: "false"
            - name: svc_enable
              value: "true"
            # One leader per Service, elected on a Lease in its namespace.
            - name: svc_election
              value: "true"
            - name: lb_class_only
              value: "true"
            - name: vip_leaseduration
              value: "5"
            - name: vip_renewdeadline
              value: "3"
            - name: vip_retryperiod
              value: "1"
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
