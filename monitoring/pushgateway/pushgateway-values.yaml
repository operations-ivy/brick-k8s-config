# Prometheus Pushgateway — for batch jobs (e.g. wigle-sync's hourly CronJob)
# whose pods exit long before Prometheus would ever scrape them. Jobs push
# their results here at the end of each run; Prometheus scrapes the gateway.

serviceMonitor:
  enabled: true
  namespace: monitoring
  # Keep the pushing job's own `job`/`instance` labels instead of overwriting
  # them with the gateway's.
  honorLabels: true

# Pushed series otherwise vanish on a pod restart, taking "last successful
# sync" timestamps and maintenance windows with them until the next run that
# sets them. The chart only mounts the volume at /data: the gateway saves
# there only when told to (2026-11-23: a restart in brick2000's Wi-Fi outage
# lost brick1982's indefinite maintenance window; /data was empty).
extraArgs:
  - --persistence.file=/data/pushgateway.data

persistentVolume:
  enabled: true
  size: 100Mi
  # Argo CD never prunes or deletes the data (brick-k8s-config#42).
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false

resources:
  requests:
    memory: 16Mi
    cpu: 10m
  limits:
    memory: 64Mi
    cpu: 50m
