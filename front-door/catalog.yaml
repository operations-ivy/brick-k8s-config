        <g fill="#c2c7cd"><rect x="178" y="27" width="44" height="4"/><rect x="178" y="41" width="36" height="4"/><rect x="178" y="55" width="44" height="4"/><rect x="178" y="69" width="30" height="4"/><rect x="178" y="83" width="40" height="4"/><rect x="178" y="97" width="34" height="4"/></g>
