# The kube-prometheus-stack Helm release: chart pinned here, values from git
# (monitoring/kube-prometheus-stack/kube-prometheus-stack-values.yaml). Bump the chart here and in validate.yaml together.
#
# Manual sync until it has shown no diff against what's live (#42).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.5.0
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/monitoring/kube-prometheus-stack/kube-prometheus-stack-values.yaml
    - repoURL: https://github.com/operations-ivy/brick-k8s-config.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      # The Prometheus Operator's CRDs are too big for client-side apply.
      - ServerSideApply=true
