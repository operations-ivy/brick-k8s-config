==== */\n.tl-mobile.tl-skinny .tl-media .tl-media-bluesky .bluesky-post {\n  padding: 10px;\n  max-height: 350px;\n}\n.tl-mobile.tl-skinny .tl-media .tl-media-bluesky .bluesky-avatar {\n  width: 32px;\n  height: 32px;\n  margin-right: 8px;\n}\n.tl-mobile.tl-skinny .tl-media .tl-media-bluesky .bluesky-image {\n  max-height: 250px;\n}\n.tl-media .tl-media-profile {\n  border-radius: 50%;\n}\n.tl-media .tl-media-iframe {\n  width: 100%;\n  height: 100%;\n}\n.tl-media .tl-media-iframe iframe {\n  width: 100%;\n  height: 100%;\n}\n.tl-media .tl-media-wikipedia {\n  text-align: left;\n  margin-left: auto;\n  margin-right: auto;\n  clear: both;\n}\n.tl-media .tl-media-wikipedia .tl-icon-wikipedia {\n  font-size: 32px;\n  margin-right: 10px;\n  float: left;\n  padding-top: 3px;\n}\n.tl-media .tl-media-wikipedia .tl-wikipedia-pageimage {\n  float: left;\n  margin-right: 10px;\n  margin-bottom: 5px;\n  margin-top: 5px;\n}\n.tl-media .tl-media-wikipedia .tl-wikipedia-title {\n  margin-left: 60px;\n  padding-left: 10px;\n  border-left: 1px solid #000000;\n  margin-bottom: 10px;\n}\n.tl-media .tl-media-wikipedia .tl-wikipedia-source {\n  font-size: 13px;\n  line-height: 15px;\n  font-style: italic;\n  margin-top: 3px;\n  display: block;\n  color: rgba(255, 255, 255, 0.5);\n}\n.tl-media .tl-media-wikipedia h4 {\n  margin-top: 0px;\n  margin-bottom: 0px;\n}\n.tl-media .tl-media-wikipedia h4 a {\n  color: #FFF;\n  text-decoration: none;\n}\n.tl-media .tl-media-wikipedia p {\n  font-size: 13px;\n  line-height: 19px;\n}\n.tl-slide-media-only .tl-media .tl-media-wikipedia {\n  border-right: 0;\n  border-top: 1px solid #000000;\n  width: 80%;\n  margin-left: auto;\n  margin-right: auto;\n  margin-top: 25px;\n  padding-top: 25px;\n}\n.tl-slide.tl-full-image-background .tl-media .tl-media-wikipedia,\n.tl-slide.tl-full-color-background .tl-media .tl-media-wikipedia {\n  padding: 20px;\n  /* Fallback for web browsers that doesn't support RGBa */\n  background: #000000 transparent;\n  /* RGBa with 0.6 opacity */\n  background: rgba(0, 0, 0, 0.6);\n  -webkit-border-radius: 7px;\n  -moz-border-radius: 7px;\n  border-radius: 7px;\n}\n.tl-slide.tl-full-image-background .tl-media .tl-media-wikipedia h4 a,\n.tl-slide.tl-full-color-background .tl-media .tl-media-wikipedia h4 a {\n  color: #FFF !important;\n  text-shadow: 1px 1px 1px #000 !important;\n}\n.tl-slide.tl-full-image-background .tl-media .tl-media-wikipedia a:hover,\n.tl-slide.tl-full-color-background .tl-media .tl-media-wikipedia a:hover {\n  text-decoration: underline;\n  color: #c34528;\n}\n.tl-slide.tl-full-image-background .tl-media .tl-media-wikipedia .tl-wikipedia-title,\n.tl-slide.tl-full-color-background .tl-media .tl-media-wikipedia .tl-wikipedia-title {\n  border-color: rgba(0, 0, 0, 0.25);\n}\n.tl-slide.tl-full-image-background .tl-media .tl-media-wikipedia .tl-wikipedia-source,\n.tl-slide.tl-full-color-background .tl-media .tl-media-wikipedia .tl-wikipedia-source {\n  color: rgba(0, 0, 0, 0.85);\n}\n.tl-mobile.tl-skinny .tl-media .tl-media-wikipedia,\n.tl-skinny .tl-media .tl-media-wikipedia {\n  margin-left: 10px;\n  margin-right: 10px;\n}\n.tl-media .tl-media-website {\n  text-align: left;\n  margin-left: auto;\n  margin-right: auto;\n  clear: both;\n}\n.tl-media .tl-media-website .tl-media-website-description {\n  font-size: 16px;\n  line-height: 19px;\n  font-style: italic;\n  margin-bottom: 10px;\n  text-transform: uppercase;\n}\n.tl-media .tl-media-website h4 {\n  margin-top: 0px;\n  margin-bottom: 0px;\n  line-height: 1;\n}\n.tl-media .tl-media-website h4 a {\n  color: #FFF;\n  text-decoration: none;\n}\n.tl-media .tl-media-website p {\n  font-size: 13px;\n  line-height: 19px;\n}\n.tl-media .tl-media-content-container .tl-media-content .tl-media-website img {\n  float: right;\n  max-width: 120px;\n  max-height: 120px;\n  margin: 4px 0 0 15px;\n}\n.tl-media .tl-media-content-container .tl-media-content .tl-media-website img.tl-media-website-icon {\n  max-width: 16px;\n  max-height: 16px;\n  float: none;\n  margin: 0;\n  margin-right: 3px;\n}\n.tl-slide.tl-full-image-background .tl-media .tl-media-website,\n.tl-slide.tl-full-color-background .tl-media .tl-media-website {\n  padding: 20px;\n  /* Fallback for web browsers that doesn't support RGBa */\n  background: #000000 transparent;\n  /* RGBa with 0.6 opacity */\n  background: rgba(0, 0, 0, 0.6);\n  -webkit-border-radius: 7px;\n  -moz-border-radius: 7px;\n  border-radius: 7px;\n}\n.tl-slide.tl-full-image-background .tl-media .tl-media-website h4 a,\n.tl-slide.tl-full-color-background .tl-media .tl-media-website h4 a {\n  color: #FFF !important;\n  text-shadow: 1px 1px 1px #000 !important;\n}\n.tl-slide.tl-full-image-background .tl-media .tl-media-website a:hover,\n.tl-slide.tl-full-color-background .tl-media .tl-media-website a:hover {\n  text-decoration: underline;\n  color: #c34528;\n}\n.tl-mobile.tl-skinny .tl-media .tl-media-website {\n  margin-left: 10px;\n  margin-right: 10px;\n}\n/* Timeline\n================================================== */\n.tl-timeline {\n  width: 100%;\n  height: 100%;\n  font-size: 16px;\n  line-height: normal;\n  overflow: hidden;\n  position: relative;\n  -webkit-user-select: none;\n  -moz-user-select: none;\n  -ms-user-select: none;\n  -o-user-select: none;\n  user-select: none;\n  background-color: #333;\n  color: #808080;\n  -webkit-box-sizing: content-box;\n  -moz-box-sizing: content-box;\n  box-sizing: content-box;\n}\n.tl-timeline.tl-timeline-embed {\n  box-sizing: border-box;\n  border-top: 1px solid #000000;\n  border-bottom: 1px solid #000000;\n  border-radius: 0;\n}\n.tl-timeline.tl-timeline-full-embed {\n  box-sizing: border-box;\n  border: 1px solid #000000;\n  border-radius: 8px;\n}\n.tl-timeline .tl-attribution {\n  cursor: pointer;\n  z-index: 9;\n  position: absolute;\n  bottom: 2px;\n  left: 0px;\n  font-size: 10px;\n  line-height: 10px;\n  font-family: \"Helvetica Neue\", Helvetica, Arial, sans-serif !important;\n  background-color: rgba(51, 51, 51, 0.85);\n  padding: 3px;\n}\n.tl-timeline .tl-attribution a {\n  color: #737373;\n}\n.tl-timeline .tl-attribution a:hover,\n.tl-timeline .tl-attribution a:focus-visible {\n  color: #FFF;\n  text-decoration: none;\n}\n.tl-timeline .tl-attribution a:hover .tl-knightlab-logo,\n.tl-timeline .tl-attribution a:focus-visible .tl-knightlab-logo {\n  background-color: #c34528;\n}\n.tl-timeline .tl-attribution .tl-knightlab-logo {\n  display: inline-block;\n  vertical-align: middle;\n  height: 8px;\n  width: 8px;\n  margin-right: 3px;\n  background-color: #c34528;\n  background-color: #737373;\n  transform: rotate(45deg);\n  -ms-transform: rotate(45deg);\n  -webkit-transform: rotate(45deg);\n}\n/* Portrait\n================================================== */\n.tl-layout-portrait .tl-storyslider {\n  -webkit-box-shadow: 0px -3px 6px rgba(0, 0, 0, 0.2);\n  -moz-box-shadow: 0px -3px 6px rgba(0, 0, 0, 0.2);\n  box-shadow: 0px -3px 6px rgba(0, 0, 0, 0.2);\n}\n.tl-rtl .tl-text-content,\n.tl-rtl .tl-headline,\n.tl-rtl .tl-media-blockquote,\n.tl-rtl .tl-headline-date,\n.tl-rtl .tl-timeline blockquote p,\n.tl-rtl .tl-media-website,\n.tl-rtl .tl-media-wikipedia,\n.tl-rtl .tl-media .tl-media-blockquote blockquote,\n.tl-rtl .blockquote,\n.tl-rtl blockquote p,\n.tl-rtl .tl-text-content p {\n  text-align: right;\n  direction: rtl;\n}\n.tl-rtl .tl-slide-media-only .tl-headline,\n.tl-rtl .tl-slide-media-only .tl-headline-date {\n  text-align: center;\n}\n.tl-rtl .tl-timemarker-text {\n  margin-right: 35px;\n}\n.tl-rtl .tl-timemarker-content-container .tl-timemarker-content .tl-timemarker-media-container {\n  float: right;\n}\n.tl-rtl .tl-caption {\n  text-align: right;\n}\n.tl-rtl .tl-credit {\n  text-align: left;\n}\n"
