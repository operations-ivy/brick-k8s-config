# Bluetooth, Wi-Fi and UPnP watch. From operations-ivy/overwatch's k8s_config/ on main.
#
# Automated (#42): a merge to main is a deploy, a hand-made change is put
# back, and an object deleted from git is deleted here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: overwatch
  namespace: argocd
spec:
  project: apps
  source:
    repoURL: https://github.com/operations-ivy/overwatch.git
    targetRevision: main
    path: k8s_config
    # Rendered with Kustomize, which Argo detects from k8s_config/kustomization.yaml.
    # No `kustomize: {}` here: the API server drops the empty object, so root
    # would see a diff it can never sync. The kustomization single-sources the
    # image tag. Not directory mode - that would apply the kustomization.yaml
    # itself as a manifest and fail on its unknown GVK.
  destination:
    server: https://kubernetes.default.svc
    namespace: overwatch
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
