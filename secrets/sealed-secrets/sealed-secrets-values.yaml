resources:
  requests:
    memory: 64Mi
    cpu: 50m
  limits:
    memory: 128Mi
    cpu: 100m

# Default liveness/readiness probes have no startup grace period at all
# (periodSeconds 10, failureThreshold 3 = ~30s) — first-boot RSA-4096
# keypair generation on a Pi 5 node didn't finish in time, so the
# container got killed and restarted before it ever came up, forever.
# A startup probe with a much longer budget fixes it without loosening
# the steady-state liveness/readiness checks.
startupProbe:
  enabled: true
  periodSeconds: 5
  failureThreshold: 36
